[workspace]
# Pinned explicitly rather than inferred from the package's edition, so the
# resolver is visible here and matches the root and `tools/` workspaces. Those two
# are virtual manifests, which default to resolver 1, so all three must say it.
resolver = "3"

[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
xshell = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
flate2 = "1"
tar = "0.4"
brotli = "7"
coverage = { path = "../tools/coverage" }
doctests = { path = "../tools/doctests" }
tabled = "0.21.0"
url = "2.5.8"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# `ToTokens`, to render a decode's target type and SQL argument back to source text
# for the `sqlx-newtype-decode` allowlist key (#715). Already in the tree via `syn`.
quote = "1"
tempfile = "3"
