# .cargo/mutants.toml

# One exclusion, and it is a property of the code rather than of the machine
# running the scan:
#
# - server/src/assets.rs: a RustEmbed derive and nothing else. There is no logic
#   to mutate.
#
# What is deliberately NOT excluded, and why the earlier list was wrong:
#
# - server/src/main.rs was excluded as a "binary entry point, no unit tests
#   possible". It has a test module. `run()` is dispatch that tests do drive, and
#   excluding the file to avoid `fn main` threw that away too.
# - server/src/observability.rs was excluded as "no logic to mutate". It is over
#   a thousand lines of filter/threshold/parsing code with its own tests — some
#   of the best mutation targets in the tree.
# - storage/src/postgres/** cannot be settled here at all: whether it is
#   mutatable depends on whether a PostgreSQL cluster is running, which a static
#   config file cannot know. .mutants-loop/common.sh decides it, together with
#   the test filter that must move with it. See MUTANTS_WITH_POSTGRES there.
exclude_globs = [
    "server/src/assets.rs",
]

# Auto-set timeout relative to baseline; add 20% headroom
timeout_multiplier = 1.2

# Cap lints so warning-as-errors don't make mutants unviable
cap_lints = true
