[package]
name = "common"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
email_address.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
croner.workspace = true
macros = { path = "../macros" }
ammonia = { workspace = true, optional = true }
orgize.workspace = true
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true
url = { workspace = true }
serde_json = "1"
# tinyvec 1.13.0 does not compile with its alloc-only feature under Rust 1.97.
tinyvec = "=1.11.0"
unicode-normalization = "0.1"
unicode-segmentation = "1"


[features]
# Optional, host-only sqlx bridge for `#[derive(StrNewtype)]` types (Type/Encode/
# Decode). Off by default and never enabled for wasm — the CSR/wasm build pulls
# `common` without it, so `sqlx` is never in the wasm dependency graph.
sqlx = ["dep:sqlx"]
# Optional host-only sanitizer for inbound rendered HTML. CSR/wasm callers leave
# this feature off, so `ammonia` stays out of their dependency graph.
sanitize = ["dep:ammonia"]
# Compiles shared test-only helpers such as the capturing mail sender. Password
# KDF test parameters are host-owned and no longer ride this feature.
test-utils = []
# Compiles `common::test_support` (shared test fixtures) for downstream test crates;
# `common`'s own tests get it via `cfg(test)`. Pulls no extra deps.
test-support = []

[dev-dependencies]
axum = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
rstest.workspace = true
sha2.workspace = true

[lints]
workspace = true
