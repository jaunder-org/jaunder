version: 2
updates:
  # Keep GitHub Actions pinned versions current (and surface runtime
  # deprecations, e.g. node20 -> node24) via automated PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/tools"
      - "/xtask"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    milestone: 34
