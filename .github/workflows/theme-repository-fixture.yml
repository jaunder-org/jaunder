name: Theme repository fixture

on:
  push:
    tags:
      - v0.0.0-theme-repository-fixture.[1-9]*
  pull_request:
    paths:
      - .github/workflows/theme-repository.yml
      - .github/workflows/theme-repository-fixture.yml
      - Cargo.lock
      - Cargo.toml
      - common/src/seed.rs
      - common/src/theme.rs
      - flake.lock
      - flake.nix
      - host/src/theme_package.rs
      - host/src/theme_repository.rs
      - nix/**
      - server/assets/**
      - server/src/assets.rs
      - server/src/cli.rs
      - server/src/commands/theme*.rs
      - scripts/test-theme-repository-release-version.sh
      - storage/src/public_theme.rs
      - web/src/**
      - testdata/theme-repository/minimal/**
  workflow_dispatch:

jobs:
  release-version-contract:
    name: Check release version contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/test-theme-repository-release-version.sh

  package:
    needs: release-version-contract
    permissions:
      contents: write
    uses: ./.github/workflows/theme-repository.yml
    with:
      jaunder-revision: 2c0264492882bf3338394397d70475cbf4023350
      theme-directory: testdata/theme-repository/minimal
