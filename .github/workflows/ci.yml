name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run the required checks on merge-queue branches (gh-readonly-queue/…) so the
  # queue can gate on the combined-with-main state. Both required contexts —
  # "Validate (no e2e)" and "e2e gate" — must report on the queue branch; a
  # documentation-only entry runs only the docs lane, as a pull request does.
  # See docs/ci-merge-queue.md.
  merge_group:

# A new commit pushed to a pull request cancels that pull request's superseded
# run. Every other run is its own group, so merge-queue and push runs are never
# cancelled or queued.
concurrency:
  group:
    ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number
    || github.run_id }}
  cancel-in-progress: true

# Runner selection for every job that builds: pin the image, never `ubuntu-latest`.
# `-latest` migrates whenever GitHub rolls the image family, so an unrelated PR is the
# one that discovers the new toolchain — a CI break with no commit that caused it.
# Bumping the pin is then a deliberate, revertable commit. (`ubuntu-latest` ==
# `ubuntu-24.04` as of image 20260720.247, so the pin is behaviour-neutral today;
# `ubuntu-26.04` exists but is still public preview.)
#
# These jobs must also stay x86_64 on a full VM. The test-checks lane's combined
# Emacs coverage producer and the browser E2E checks build NixOS test machines hardcoded
# to `x86_64-linux` (`nix/nixos.nix`'s `interactiveTestingVmSystem` /
# `postgresTestingVmSystem`), and the jaunder-org cachix cache is populated for that
# system only — an arm64 runner would emulate the VM and rebuild the world cold. They
# also need a privileged, long-lived environment for the nix daemon and test VMs,
# which rules out the container-based `ubuntu-slim` tier that the merge-queue
# verdict and the result-only gates use below.
jobs:
  # A merge-queue run's verdict is the verdict for the commit it tested, so a
  # push to `main` of a commit whose `merge_group` run passed both required
  # checks skips everything except `validate-host` (main's kache writer). Any
  # other push, including an admin bypass of the queue, validates in full. See
  # docs/ci-merge-queue.md, "Checks on a landed commit", for the decision record.
  # (Never cite an ADR draft path in a workflow: promotion rewrites it, and the
  # promoter App may not push workflow changes.)
  #
  # The event test lives in the output expression, so a pull_request or
  # merge_group run can never skip. `github-script` runs on the runner's bundled
  # Node and needs none of the slim image's software (see `e2e gate` below).
  #
  # This job also projects the e2e matrices from the lane catalog. It is the
  # first job to get a runner, so the e2e lanes never queue behind a separate
  # catalog job while the account's concurrent-job limit is saturated. The
  # projection uses the slim image's own `jq`; the pinned `jq` runs the same
  # script in the hermetic checks.
  #
  # It also decides whether the change is documentation-only, with the slim
  # image's own `python3` and `git` running `dev.scope`, which needs only the
  # standard library; the pinned Python runs the same module in `dev`'s tests. A
  # push has no base, so it is never documentation-only.
  merge-queue-verdict:
    name: Merge-queue verdict
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    outputs:
      tested:
        ${{ github.event_name == 'push' && steps.lookup.outputs.tested == 'true'
        }}
      lanes: ${{ steps.matrix.outputs.lanes }}
      reconciles: ${{ steps.matrix.outputs.reconciles }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Look up a passing merge-queue run of this commit
        id: lookup
        if: github.event_name == 'push'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const required = ["Validate (no e2e)", "e2e gate"];
            try {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: "ci.yml", event: "merge_group",
                head_sha: context.sha, per_page: 100,
              });
              for (const run of runs) {
                // Required jobs, not the run's conclusion: the queue merges as
                // soon as they pass, possibly before the run is marked complete.
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: run.id, per_page: 100,
                });
                const passed = new Set(
                  jobs.filter((job) => job.conclusion === "success").map((job) => job.name),
                );
                if (required.every((name) => passed.has(name))) {
                  core.setOutput("tested", "true");
                  await core.summary
                    .addRaw(`Merge-queue run [${run.id}](${run.html_url}) passed ${required.join(" and ")} on ${context.sha}; its other lanes are not re-run.`)
                    .write();
                  return;
                }
              }
              core.setOutput("tested", "false");
              await core.summary
                .addRaw(`No passing merge-queue run of ${context.sha}; validating in full.`)
                .write();
            } catch (error) {
              core.warning(`Merge-queue lookup failed, validating in full: ${error.message}`);
              core.setOutput("tested", "false");
            }
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            end2end/e2e-lanes.json
            scripts/e2e-matrix.jq
            tools/dev/dev/__init__.py
            tools/dev/dev/rawdiff.py
            tools/dev/dev/scope.py
          sparse-checkout-cone-mode: false
      - name: Read enabled producer matrices from the catalog
        id: matrix
        run:
          jq -r -f scripts/e2e-matrix.jq end2end/e2e-lanes.json >>
          "$GITHUB_OUTPUT"
      - name: Decide whether the change is documentation-only
        id: scope
        env:
          BASE:
            ${{ github.event.pull_request.base.sha ||
            github.event.merge_group.base_sha }}
          PYTHONPATH: tools/dev
        run: python3 -m dev.scope --base "$BASE" >> "$GITHUB_OUTPUT"

  # Main's only kache writer: it still runs for a merge-queue-tested push, and
  # skips only for a documentation-only change.
  validate-host:
    name: Validation host
    runs-on: ubuntu-24.04
    needs: [merge-queue-verdict]
    if:
      ${{ !cancelled() && needs.merge-queue-verdict.outputs.docs_only != 'true'
      }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The host lane's tests run host Cargo.
          cargo-cache: "true"
      # The kache store saved by the newest `main` run (see "Save compile
      # cache"). The store stays in kache's default location; only the daemon's
      # socket and locks move, so they never enter the saved archive.
      - name: Configure compile cache
        run: echo "KACHE_RUNTIME_DIR=$HOME/.cache/kache-run" >> "$GITHUB_ENV"
      - name: Restore compile cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/kache
          key: kache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kache-${{ runner.os }}-
      # Upload the post-cache baseline before heavy work: a runner-level
      # ENOSPC crash can prevent even always() post-validation steps executing.
      - name: Capture host resource baseline
        id: host-resource-baseline
        continue-on-error: true
        run: bash scripts/ci-storage-probe .xtask/host-resource-baseline.txt baseline
      - name: Upload host resource baseline
        if: always() && steps.host-resource-baseline.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-host-resource-baseline
          path: .xtask/host-resource-baseline.txt
          if-no-files-found: error
          retention-days: 14
      - name: Validate host lane (via dev)
        run: nix develop .#ci --accept-flake-config -c dev ci-validate-host
      # Diagnostic only: the table never decides the job's result.
      - name: Trace summary
        if: always()
        run:
          nix develop .#ci --accept-flake-config -c sh -c 'dev trace
          summary --markdown >> "$GITHUB_STEP_SUMMARY"' || echo "::warning::Trace summary unavailable, see this step's log"
      - name: Upload host validation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-host-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      # Diagnostic only: hits and misses for this lane.
      - name: Compile cache stats
        if: always()
        continue-on-error: true
        run: nix develop .#ci --accept-flake-config -c kache stats
      # Only `main` saves the store; pull requests and the merge queue restore
      # it. GC brings the store within its cap, and stopping the daemon leaves
      # an index nothing is writing. Entries are immutable, so the key is
      # run-stamped and superseded ones age out of the Actions cache.
      - name: Prune compile cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          nix develop .#ci --accept-flake-config -c kache gc
          nix develop .#ci --accept-flake-config -c kache daemon stop
      - name: Save compile cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/kache
          key: kache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  validate-hermetic:
    name: Validation hermetic
    runs-on: ubuntu-24.04
    needs: [merge-queue-verdict]
    if:
      needs.merge-queue-verdict.outputs.tested != 'true' &&
      needs.merge-queue-verdict.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate hermetic lane (via dev)
        run: nix develop .#ci-nix --accept-flake-config -c dev ci-validate-hermetic
      # Diagnostic only: the table never decides the job's result.
      - name: Trace summary
        if: always()
        run:
          nix develop .#ci-nix --accept-flake-config -c sh -c 'dev trace
          summary --markdown >> "$GITHUB_STEP_SUMMARY"' || echo "::warning::Trace summary unavailable, see this step's log"
      - name: Upload hermetic validation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-hermetic-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  validate-test-checks:
    name: Validation test checks
    runs-on: ubuntu-24.04
    needs: [merge-queue-verdict]
    if:
      needs.merge-queue-verdict.outputs.tested != 'true' &&
      needs.merge-queue-verdict.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build UX sandbox helper for Cachix
        run:
          nix build --no-update-lock-file --no-write-lock-file --no-link
          .#ux-sandbox
      - name: Validate test checks lane (via dev)
        run:
          nix develop .#ci-nix --accept-flake-config -c dev ci-validate-test-checks
      - name: Build Emacs package for Cachix
        run:
          nix build --accept-flake-config --no-link
          .#emacsPackages.x86_64-linux.jaunder
      # Diagnostic only: the table never decides the job's result.
      - name: Trace summary
        if: always()
        run:
          nix develop .#ci-nix --accept-flake-config -c sh -c 'dev trace
          summary --markdown >> "$GITHUB_STEP_SUMMARY"' || echo "::warning::Trace summary unavailable, see this step's log"
      - name: Upload test checks validation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-test-checks-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/gcroots/elisp-coverage-producer/elisp-coverage/
            .xtask/run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  validate-coverage:
    name: Validation coverage
    runs-on: ubuntu-24.04
    needs: [merge-queue-verdict]
    if:
      needs.merge-queue-verdict.outputs.tested != 'true' &&
      needs.merge-queue-verdict.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Capture coverage storage baseline
        id: coverage-storage-baseline
        continue-on-error: true
        run: bash scripts/ci-storage-probe .xtask/coverage-storage-snapshot.txt baseline
      - name: Validate Rust coverage lane (via dev)
        run: nix develop .#ci-nix --accept-flake-config -c dev coverage
      # Diagnostic only: the table never decides the job's result.
      - name: Trace summary
        if: always()
        run:
          nix develop .#ci-nix --accept-flake-config -c sh -c 'dev trace
          summary --markdown >> "$GITHUB_STEP_SUMMARY"' || echo "::warning::Trace summary unavailable, see this step's log"
      - name: Capture coverage storage final snapshot
        if: always()
        continue-on-error: true
        run: bash scripts/ci-storage-probe .xtask/coverage-storage-snapshot.txt final
      - name: Upload coverage storage snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-coverage-storage-snapshot
          path: .xtask/coverage-storage-snapshot.txt
          # Written by best-effort probe steps that may not have run.
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage validation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-coverage-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/gcroots/coverage/status.json
            .xtask/gcroots/coverage/diagnostics/
            .xtask/run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # A documentation-only change runs only this lane, which alone decides it.
  validate-docs:
    name: Validation docs
    runs-on: ubuntu-24.04
    needs: [merge-queue-verdict]
    if: needs.merge-queue-verdict.outputs.docs_only == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate docs lane (via dev)
        run: nix develop .#ci --accept-flake-config -c dev ci-validate-docs
      # Diagnostic only: the table never decides the job's result.
      - name: Trace summary
        if: always()
        run:
          nix develop .#ci --accept-flake-config -c sh -c 'dev trace
          summary --markdown >> "$GITHUB_STEP_SUMMARY"' || echo "::warning::Trace summary unavailable, see this step's log"
      - name: Upload docs validation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-docs-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  validate-no-e2e:
    name: Validate (no e2e)
    runs-on: ubuntu-slim
    needs:
      [
        merge-queue-verdict,
        validate-docs,
        validate-host,
        validate-hermetic,
        validate-test-checks,
        validate-coverage,
      ]
    # Keep !cancelled(): without a status function a failed lane would skip
    # this required check, and branch protection accepts a skipped check. A
    # cancelled run reports skipped, but it is superseded by a newer run, and
    # the merge queue runs the required checks again before anything lands.
    if:
      ${{ !cancelled() && needs.merge-queue-verdict.outputs.tested != 'true' }}
    steps:
      - name: Require the scope's validation lanes to pass
        run: |
          verdict="${{ needs.merge-queue-verdict.result }}"
          docs_only="${{ needs.merge-queue-verdict.outputs.docs_only }}"
          docs="${{ needs.validate-docs.result }}"
          host="${{ needs.validate-host.result }}"
          hermetic="${{ needs.validate-hermetic.result }}"
          test_checks="${{ needs.validate-test-checks.result }}"
          coverage="${{ needs.validate-coverage.result }}"
          echo "validation lane results: verdict=$verdict docs_only=$docs_only docs=$docs host=$host hermetic=$hermetic test-checks=$test_checks coverage=$coverage"
          test "$verdict" = "success"
          if [ "$docs_only" = "true" ]; then
            test "$docs" = "success"
          else
            test "$host" = "success"
            test "$hermetic" = "success"
            test "$test_checks" = "success"
            test "$coverage" = "success"
          fi

  e2e-lane:
    name: e2e (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    needs: [merge-queue-verdict]
    if:
      needs.merge-queue-verdict.outputs.tested != 'true' &&
      needs.merge-queue-verdict.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.merge-queue-verdict.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Capture lane storage baseline
        id: lane-storage-baseline
        continue-on-error: true
        run: bash scripts/ci-storage-probe .xtask/lane-storage-snapshot.txt baseline
      - name: Capture lane storage after ci-nix shell entry
        continue-on-error: true
        run: |
          nix develop .#ci-nix --accept-flake-config -c \
            bash scripts/ci-storage-probe .xtask/lane-storage-snapshot.txt "after ci-nix shell entry"
      - name: Run isolated lane producer
        run:
          nix develop .#ci-nix --accept-flake-config -c dev e2e-producer ${{
          matrix.lane }}
      # Diagnostic only: the table never decides the job's result.
      - name: Trace summary
        if: always()
        run:
          nix develop .#ci-nix --accept-flake-config -c sh -c 'dev trace
          summary --markdown >> "$GITHUB_STEP_SUMMARY"' || echo "::warning::Trace summary unavailable, see this step's log"
      - name: Capture lane final storage snapshot
        if: always()
        continue-on-error: true
        run: bash scripts/ci-storage-probe .xtask/lane-storage-snapshot.txt final
      - name: Upload lane storage snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-storage-snapshot-${{ matrix.lane }}
          path: .xtask/lane-storage-snapshot.txt
          # Written by best-effort probe steps that may not have run.
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload lane-qualified e2e evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-lane-${{ matrix.lane }}
          path: .xtask/diagnostics/
          # Producer evidence for the reconcile job: an upload failure stays
          # the lane's.
          if-no-files-found: warn
          retention-days: 14
      # A separate artifact: the reconcile job merges every lane's evidence
      # artifact into one diagnostics root, where traces do not belong.
      - name: Upload lane traces
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-trace-${{ matrix.lane }}
          path: .xtask/run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  e2e-reconcile:
    name: e2e reconcile (${{ matrix.backend }}/${{ matrix.browser }})
    runs-on: ubuntu-24.04
    needs: [merge-queue-verdict, e2e-lane]
    # Runs after a failed lane too, to reconcile what the others produced.
    if:
      ${{ !cancelled() && needs.merge-queue-verdict.result == 'success' &&
      needs.merge-queue-verdict.outputs.tested != 'true' &&
      needs.merge-queue-verdict.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.merge-queue-verdict.outputs.reconciles) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Download this pair's lane evidence
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: e2e-lane-${{ matrix.backend }}-${{ matrix.browser }}-*
          path: .xtask/e2e-lanes
          merge-multiple: true
      # SQLite/Chromium reconciliation also verifies server-function coverage.
      - name: Reconcile lane evidence even when downloads are missing
        if: always()
        run: |
          mkdir -p .xtask
          nix develop .#ci-nix --accept-flake-config -c dev e2e-reconcile ${{ matrix.backend }} ${{ matrix.browser }} .xtask/e2e-lanes > .xtask/reconcile.log 2>&1
      # Diagnostic only: the table never decides the job's result.
      - name: Trace summary
        if: always()
        run:
          nix develop .#ci-nix --accept-flake-config -c sh -c 'dev trace
          summary --markdown >> "$GITHUB_STEP_SUMMARY"' || echo "::warning::Trace summary unavailable, see this step's log"
      - name: Upload reconciliation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-reconcile-${{ matrix.backend }}-${{ matrix.browser }}
          path: |
            .xtask/reconcile.log
            .xtask/run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  e2e-gate:
    name: e2e gate
    # Result-only gate: no checkout, nix, or build — four lines of shell over the
    # `needs` result, ~3s wall clock. `ubuntu-slim` is 1 vCPU / 5GB in a container
    # on a shared host, so it skips VM boot and is intended for GitHub aggregation
    # jobs like this one.
    #
    # Its three constraints are all satisfied here, and are what to re-check before
    # adding a step: a hard 15-minute cap (we use ~3s); an unprivileged container, so
    # no mounts / Docker-in-Docker / kernel features (we run `test` and `echo`); and a
    # minimal toolset, so nothing beyond coreutils+bash is guaranteed present. Any
    # step that needs a checkout or nix belongs in a different job, not here.
    #
    # Unpinned by necessity — GitHub ships no versioned `ubuntu-slim-*` label. That is
    # tolerable only because the job depends on none of the image's preinstalled
    # software, which is exactly the property the paragraph above protects.
    runs-on: ubuntu-slim
    needs: [merge-queue-verdict, e2e-lane, e2e-reconcile]
    # Keep !cancelled(): without a status function a failed lane would skip
    # this required check.
    if:
      ${{ !cancelled() && needs.merge-queue-verdict.outputs.tested != 'true' }}
    steps:
      - name: Require all e2e matrix jobs to pass, or none to run
        run: |
          test "${{ needs.merge-queue-verdict.result }}" = "success"
          docs_only="${{ needs.merge-queue-verdict.outputs.docs_only }}"
          lanes="${{ needs.e2e-lane.result }}"
          reconcile="${{ needs.e2e-reconcile.result }}"
          echo "e2e results: docs_only=$docs_only lanes=$lanes reconcile=$reconcile"
          if [ "$docs_only" = "true" ]; then
            test "$lanes" = "skipped"
            test "$reconcile" = "skipped"
          else
            test "$lanes" = "success"
            test "$reconcile" = "success"
          fi
