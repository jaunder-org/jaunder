name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run the required checks on merge-queue branches (gh-readonly-queue/…) so the
  # queue can gate on the combined-with-main state. All jobs run on merge_group:
  # both required contexts — "Validate (no e2e)" and "e2e gate" (via its needs) —
  # must report on the queue branch. See docs/ci-merge-queue.md.
  merge_group:

# Runner selection, for the three jobs that build: pin the image, never `ubuntu-latest`.
# `-latest` migrates whenever GitHub rolls the image family, so an unrelated PR is the
# one that discovers the new toolchain — a CI break with no commit that caused it.
# Bumping the pin is then a deliberate, revertable commit. (`ubuntu-latest` ==
# `ubuntu-24.04` as of image 20260720.247, so the pin is behaviour-neutral today;
# `ubuntu-26.04` exists but is still public preview.)
#
# Those three jobs must also stay x86_64 on a full VM. The e2e/elisp tests build a
# NixOS test machine hardcoded to `x86_64-linux` (flake.nix `interactiveTestingVmSystem`
# / `postgresTestingVmSystem`), and the jaunder-org cachix cache is populated for that
# system only — an arm64 runner would emulate the VM and rebuild the world cold. They
# also need a privileged, long-lived environment for the nix daemon and the test VMs,
# which rules out the container-based `ubuntu-slim` tier that `e2e-gate` uses below.
jobs:
  validate-no-e2e:
    name: Validate (no e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate (static + clippy + coverage, via xtask)
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask validate
          --no-e2e
      # Drift guard for the Nix coverage `src` filter (#241/#37): eval-only, so it
      # reuses this job's nix + cachix + xtask cache for ~seconds. `if: always()` so a
      # filter-drift signal is not masked by an unrelated `validate` failure.
      - name: Coverage source-drift probe (#241)
        if: always()
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask coverage
          probe-source
      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/gcroots/coverage/status.json
            .xtask/gcroots/coverage/diagnostics/
            .xtask/last-result.json
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: e2e (${{ matrix.backend }}/${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: e2e (${{ matrix.backend }}/${{ matrix.browser }}, via xtask)
        # xtask surfaces retried-but-passed tests itself: it reads the report it
        # lifts out of the VM, appends a table to $GITHUB_STEP_SUMMARY (inherited
        # env), records them in the sidecar, and prints a `flaky:` sentinel. See
        # xtask/src/steps/flaky.rs.
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask e2e ${{
          matrix.backend }} ${{ matrix.browser }}
      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ matrix.backend }}-${{ matrix.browser }}
          path: |
            .xtask/diagnostics/
            .xtask/last-result.json
          if-no-files-found: ignore
          retention-days: 14

  elisp-integration:
    name: elisp-integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: elisp-integration (live server, via xtask)
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask
          elisp-integration
      - name: Upload elisp-integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-elisp-integration
          path: |
            .xtask/diagnostics/
            .xtask/last-result.json
          if-no-files-found: ignore
          retention-days: 14

  e2e-gate:
    name: e2e gate
    # The one job that wants no VM at all: no checkout, no nix, no build — four lines
    # of shell over the `needs` results, ~3s wall clock. `ubuntu-slim` is 1 vCPU / 5GB
    # in a *container* on a shared host, so it skips VM boot entirely and is what
    # GitHub points aggregation jobs like this one at.
    #
    # Its three constraints are all satisfied here, and are what to re-check before
    # adding a step: a hard 15-minute cap (we use ~3s); an unprivileged container, so
    # no mounts / Docker-in-Docker / kernel features (we run `test` and `echo`); and a
    # minimal toolset, so nothing beyond coreutils+bash is guaranteed present. Any
    # step that needs a checkout or nix belongs in a different job, not here.
    #
    # Unpinned by necessity — GitHub ships no versioned `ubuntu-slim-*` label. That is
    # tolerable only because the job depends on none of the image's preinstalled
    # software, which is exactly the property the paragraph above protects.
    runs-on: ubuntu-slim
    needs: [e2e, elisp-integration]
    if: always()
    steps:
      - name: Require all e2e matrix + elisp-integration jobs to pass
        run: |
          e2e="${{ needs.e2e.result }}"
          elisp="${{ needs.elisp-integration.result }}"
          echo "e2e matrix result: $e2e; elisp-integration result: $elisp"
          test "$e2e" = "success" && test "$elisp" = "success"
