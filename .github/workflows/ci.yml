name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run the required checks on merge-queue branches (gh-readonly-queue/…) so the
  # queue can gate on the combined-with-main state. All jobs run on merge_group:
  # both required contexts — "Validate (no e2e)" and "e2e gate" (via its needs) —
  # must report on the queue branch. See docs/ci-merge-queue.md.
  merge_group:

# Runner selection for every job that builds: pin the image, never `ubuntu-latest`.
# `-latest` migrates whenever GitHub rolls the image family, so an unrelated PR is the
# one that discovers the new toolchain — a CI break with no commit that caused it.
# Bumping the pin is then a deliberate, revertable commit. (`ubuntu-latest` ==
# `ubuntu-24.04` as of image 20260720.247, so the pin is behaviour-neutral today;
# `ubuntu-26.04` exists but is still public preview.)
#
# These jobs must also stay x86_64 on a full VM. The test-checks lane's combined
# Emacs coverage producer and the browser E2E checks build NixOS test machines hardcoded
# to `x86_64-linux` (`nix/nixos.nix`'s `interactiveTestingVmSystem` /
# `postgresTestingVmSystem`), and the jaunder-org cachix cache is populated for that
# system only — an arm64 runner would emulate the VM and rebuild the world cold. They
# also need a privileged, long-lived environment for the nix daemon and test VMs,
# which rules out the container-based `ubuntu-slim` tier that the result-only gates
# use below.
jobs:
  validate-host:
    name: Validation host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Upload the post-cache baseline before heavy work: a runner-level
      # ENOSPC crash can prevent even always() post-validation steps executing.
      - name: Capture host resource baseline
        id: host-resource-baseline
        run: |
          mkdir -p .xtask
          report=.xtask/host-resource-baseline.txt
          printf 'Post-cache, pre-validation resource baseline\n' > "$report"
          probe() {
            printf '\n%s\n' "$1" >> "$report"
            shift
            if "$@" >> "$report" 2>&1; then
              printf 'capture_exit=0\n' >> "$report"
            else
              code=$?
              printf 'capture_exit=%s missing_evidence=true\n' "$code" >> "$report"
            fi
          }
          probe timestamp date --utc +%FT%TZ
          for path in . tools/target /tmp /nix; do
            probe "filesystem bytes: $path" df -B1 --output=size,used,avail -- "$path"
            probe "filesystem inodes: $path" df --output=itotal,iused,iavail -- "$path"
          done
          for path in tools/target; do
            probe "native target allocated bytes: $path" du -s -B1 -- "$path"
          done
          probe "owned storage allocated bytes: target" timeout 30s du -s -x -B1 -- target
          probe memory-and-swap free -b
      - name: Upload host resource baseline
        if: always() && steps.host-resource-baseline.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-host-resource-baseline
          path: .xtask/host-resource-baseline.txt
          if-no-files-found: error
          retention-days: 14
      - name: Validate host lane (via Just)
        run: nix develop .#ci --accept-flake-config -c just ci-validate-host
      - name: Upload host validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-host-diagnostics
          path: |
            .xtask/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  validate-hermetic:
    name: Validation hermetic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate hermetic lane (via Just)
        run: nix develop .#ci --accept-flake-config -c just ci-validate-hermetic
      - name: Upload hermetic validation diagnostics
        id: hermetic-diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-hermetic-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Warn on hermetic diagnostics upload failure
        if: always() && steps.hermetic-diagnostics.outcome == 'failure'
        run: |
          echo "::warning::Hermetic diagnostics upload failed; workload verdict remains authoritative"

  validate-test-checks:
    name: Validation test checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build UX sandbox helper for Cachix
        run:
          nix build --no-update-lock-file --no-write-lock-file --no-link
          .#ux-sandbox
      - name: Validate test checks lane (via Just)
        run:
          nix develop .#ci --accept-flake-config -c just ci-validate-test-checks
      - name: Build Emacs package for Cachix
        run:
          nix build --accept-flake-config --no-link
          .#emacsPackages.x86_64-linux.jaunder
      - name: Upload test checks validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-test-checks-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/gcroots/elisp-coverage-producer/elisp-coverage/
          if-no-files-found: ignore
          retention-days: 14

  validate-coverage:
    name: Validation coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Capture coverage storage baseline
        id: coverage-storage-baseline
        continue-on-error: true
        run: |
          mkdir -p .xtask
          report=.xtask/coverage-storage-snapshot.txt
          printf 'Post-setup/cache storage snapshot\n' > "$report"
          printf 'Configured workspace temporary path: %s\n' "$GITHUB_WORKSPACE/.xtask/tmp/workspace" >> "$report"
          probe() {
            printf '\n%s\n' "$1" >> "$report"
            shift
            if "$@" >> "$report" 2>&1; then
              printf 'capture_exit=0\n' >> "$report"
            else
              code=$?
              printf 'capture_exit=%s missing_evidence=true\n' "$code" >> "$report"
            fi
          }
          probe timestamp date --utc +%FT%TZ
          printf 'TMPDIR=%s\n' "${TMPDIR-<unset>}" >> "$report"
          probe configured-workspace printf '%s\n' "$GITHUB_WORKSPACE"
          for path in /nix/store "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.xtask/tmp" /tmp; do
            probe "filesystem bytes: $path" df -h -- "$path"
            probe "filesystem inodes: $path" df -i -- "$path"
            if command -v findmnt >/dev/null 2>&1; then
              probe "mount: $path" findmnt --target "$path"
            else
              printf '\nmount: %s\nfindmnt unavailable\n' "$path" >> "$report"
            fi
          done
      - name: Validate Rust coverage lane (via Just)
        run: nix develop .#ci --accept-flake-config -c just ci-validate-coverage
      - name: Capture coverage storage final snapshot
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .xtask
          report=.xtask/coverage-storage-snapshot.txt
          printf '\nFinal storage measurements (diagnostic only)\n' >> "$report"
          probe() {
            printf '\n%s\n' "$1" >> "$report"
            shift
            if "$@" >> "$report" 2>&1; then
              printf 'capture_exit=0\n' >> "$report"
            else
              code=$?
              printf 'capture_exit=%s missing_evidence=true\n' "$code" >> "$report"
            fi
          }
          probe timestamp date --utc +%FT%TZ
          printf 'TMPDIR=%s\n' "${TMPDIR-<unset>}" >> "$report"
          probe configured-workspace printf '%s\n' "$GITHUB_WORKSPACE"
          probe configured-workspace-temp printf '%s\n' "$GITHUB_WORKSPACE/.xtask/tmp/workspace"
          for path in /nix/store "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.xtask/tmp" /tmp; do
            probe "filesystem bytes: $path" df -h -- "$path"
            probe "filesystem inodes: $path" df -i -- "$path"
            if command -v findmnt >/dev/null 2>&1; then
              probe "mount: $path" findmnt --target "$path"
            else
              printf '\nmount: %s\nfindmnt unavailable\n' "$path" >> "$report"
            fi
          done
          for path in /nix/store "$GITHUB_WORKSPACE/.xtask/tmp" "$GITHUB_WORKSPACE"; do
            probe "allocated bytes: $path" timeout 10s du -shx -- "$path"
          done
      - name: Upload coverage storage snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-coverage-storage-snapshot
          path: .xtask/coverage-storage-snapshot.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-coverage-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/gcroots/coverage/status.json
            .xtask/gcroots/coverage/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  validate-no-e2e:
    name: Validate (no e2e)
    runs-on: ubuntu-slim
    needs:
      [
        validate-host,
        validate-hermetic,
        validate-test-checks,
        validate-coverage,
      ]
    if: always()
    steps:
      - name: Require all validation lanes to pass
        run: |
          host="${{ needs.validate-host.result }}"
          hermetic="${{ needs.validate-hermetic.result }}"
          test_checks="${{ needs.validate-test-checks.result }}"
          coverage="${{ needs.validate-coverage.result }}"
          echo "validation lane results: host=$host hermetic=$hermetic test-checks=$test_checks coverage=$coverage"
          test "$host" = "success"
          test "$hermetic" = "success"
          test "$test_checks" = "success"
          test "$coverage" = "success"

  e2e-catalog:
    name: E2E catalog
    runs-on: ubuntu-24.04
    outputs:
      chromium: ${{ steps.matrix.outputs.chromium }}
      firefox: ${{ steps.matrix.outputs.firefox }}
      backends: ${{ steps.matrix.outputs.backends }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Read enabled producer matrices from the catalog
        id: matrix
        run: |
          nix develop .#ci-e2e --accept-flake-config -c jq -r -f scripts/e2e-matrix.jq end2end/e2e-lanes.json >> "$GITHUB_OUTPUT"

  e2e-chromium:
    name: e2e (${{ matrix.backend }}/chromium)
    runs-on: ubuntu-24.04
    needs: [e2e-catalog]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-catalog.outputs.chromium) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: E2E disk observation (post-setup baseline)
        run: |
          if df -P / /nix/store "$GITHUB_WORKSPACE"; then
            echo "observation_status=success"
          else
            status=$?
            echo "observation_status=failure exit=$status" >&2
          fi
      - name: E2E disk observation (after ci-e2e shell entry)
        run: |
          if nix develop .#ci-e2e --accept-flake-config -c df -P / /nix/store "$GITHUB_WORKSPACE"; then
            echo "observation_status=success"
          else
            status=$?
            echo "observation_status=failure exit=$status" >&2
          fi
      - name:
          Run isolated Chromium producer and authoritative coverage when
          applicable
        run:
          nix develop .#ci-e2e --accept-flake-config -c just e2e-producer ${{
          matrix.lane }}
      - name: E2E disk observation (after producer)
        if: always()
        run: |
          if df -P / /nix/store "$GITHUB_WORKSPACE"; then
            echo "observation_status=success"
          else
            status=$?
            echo "observation_status=failure exit=$status" >&2
          fi
      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.backend }}-chromium
          path: .xtask/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: E2E disk observation (final)
        if: always()
        run: |
          if df -P / /nix/store "$GITHUB_WORKSPACE"; then
            echo "observation_status=success"
          else
            status=$?
            echo "observation_status=failure exit=$status" >&2
          fi

  e2e-firefox-lane:
    name: e2e (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    needs: [e2e-catalog]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-catalog.outputs.firefox) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Capture Firefox lane storage baseline
        id: firefox-storage-baseline
        continue-on-error: true
        run: |
          mkdir -p .xtask
          report=.xtask/firefox-storage-snapshot.txt
          printf 'Configured workspace temporary path: %s\n' "$GITHUB_WORKSPACE/.xtask/tmp/workspace" >> "$report"
          probe() {
            printf '\n%s\n' "$1" >> "$report"
            shift
            if "$@" >> "$report" 2>&1; then
              printf 'capture_exit=0\n' >> "$report"
            else
              code=$?
              printf 'capture_exit=%s missing_evidence=true\n' "$code" >> "$report"
            fi
          }
          probe timestamp date --utc +%FT%TZ
          printf 'TMPDIR=%s\n' "${TMPDIR-<unset>}" >> "$report"
          probe configured-workspace printf '%s\n' "$GITHUB_WORKSPACE"
          for path in /nix/store "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.xtask/tmp" /tmp; do
            probe "filesystem bytes: $path" df -h -- "$path"
            probe "filesystem inodes: $path" df -i -- "$path"
            if command -v findmnt >/dev/null 2>&1; then
              probe "mount: $path" findmnt --target "$path"
            else
              printf '\nmount: %s\nfindmnt unavailable\n' "$path" >> "$report"
            fi
          done
      - name: E2E disk observation (after ci-e2e shell entry)
        run: |
          if nix develop .#ci-e2e --accept-flake-config -c df -P / /nix/store "$GITHUB_WORKSPACE"; then
            echo "observation_status=success"
          else
            status=$?
            echo "observation_status=failure exit=$status" >&2
          fi
      - name: Run isolated Firefox lane
        run:
          nix develop .#ci-e2e --accept-flake-config -c just e2e-producer ${{
          matrix.lane }}
      - name: E2E disk observation (after producer)
        if: always()
        run: |
          if df -P / /nix/store "$GITHUB_WORKSPACE"; then
            echo "observation_status=success"
          else
            status=$?
            echo "observation_status=failure exit=$status" >&2
          fi
      - name: Capture Firefox lane final storage snapshot
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .xtask
          report=.xtask/firefox-storage-snapshot.txt
          printf '\nFinal storage measurements (diagnostic only)\n' >> "$report"
          probe() {
            printf '\n%s\n' "$1" >> "$report"
            shift
            if "$@" >> "$report" 2>&1; then
              printf 'capture_exit=0\n' >> "$report"
            else
              code=$?
              printf 'capture_exit=%s missing_evidence=true\n' "$code" >> "$report"
            fi
          }
          probe timestamp date --utc +%FT%TZ
          printf 'TMPDIR=%s\n' "${TMPDIR-<unset>}" >> "$report"
          probe configured-workspace printf '%s\n' "$GITHUB_WORKSPACE"
          probe configured-workspace-temp printf '%s\n' "$GITHUB_WORKSPACE/.xtask/tmp/workspace"
          for path in /nix/store "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.xtask/tmp" /tmp; do
            probe "filesystem bytes: $path" df -h -- "$path"
            probe "filesystem inodes: $path" df -i -- "$path"
            if command -v findmnt >/dev/null 2>&1; then
              probe "mount: $path" findmnt --target "$path"
            else
              printf '\nmount: %s\nfindmnt unavailable\n' "$path" >> "$report"
            fi
          done
          for path in /nix/store "$GITHUB_WORKSPACE/.xtask/tmp" "$GITHUB_WORKSPACE"; do
            probe "allocated bytes: $path" timeout 10s du -shx -- "$path"
          done
      - name: Upload lane storage snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name:
            e2e-firefox-storage-snapshot-${{ matrix.backend }}-${{ matrix.lane
            }}
          path: .xtask/firefox-storage-snapshot.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload lane-qualified e2e evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-firefox-${{ matrix.lane }}
          path: .xtask/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: E2E disk observation (final)
        if: always()
        run: |
          if df -P / /nix/store "$GITHUB_WORKSPACE"; then
            echo "observation_status=success"
          else
            status=$?
            echo "observation_status=failure exit=$status" >&2
          fi

  e2e-firefox-reconcile:
    name: e2e reconcile (${{ matrix.backend }}/firefox)
    runs-on: ubuntu-24.04
    needs: [e2e-catalog, e2e-firefox-lane]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.e2e-catalog.outputs.backends) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Download all backend Firefox evidence
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: e2e-firefox-${{ matrix.backend }}-*
          path: .xtask/e2e-firefox
          merge-multiple: true
      - name: Reconcile Firefox evidence even when downloads are missing
        if: always()
        run: |
          mkdir -p .xtask
          nix develop .#ci-e2e --accept-flake-config -c just e2e-reconcile ${{ matrix.backend }} .xtask/e2e-firefox > .xtask/firefox-reconcile.log 2>&1
      - name: Upload Firefox reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-firefox-reconcile-${{ matrix.backend }}
          path: .xtask/firefox-reconcile.log
          if-no-files-found: error
          retention-days: 14

  e2e-gate:
    name: e2e gate
    # Result-only gate: no checkout, nix, or build — four lines of shell over the
    # `needs` result, ~3s wall clock. `ubuntu-slim` is 1 vCPU / 5GB in a container
    # on a shared host, so it skips VM boot and is intended for GitHub aggregation
    # jobs like this one.
    #
    # Its three constraints are all satisfied here, and are what to re-check before
    # adding a step: a hard 15-minute cap (we use ~3s); an unprivileged container, so
    # no mounts / Docker-in-Docker / kernel features (we run `test` and `echo`); and a
    # minimal toolset, so nothing beyond coreutils+bash is guaranteed present. Any
    # step that needs a checkout or nix belongs in a different job, not here.
    #
    # Unpinned by necessity — GitHub ships no versioned `ubuntu-slim-*` label. That is
    # tolerable only because the job depends on none of the image's preinstalled
    # software, which is exactly the property the paragraph above protects.
    runs-on: ubuntu-slim
    needs: [e2e-catalog, e2e-chromium, e2e-firefox-lane, e2e-firefox-reconcile]
    if: always()
    steps:
      - name: Require all e2e matrix jobs to pass
        run: |
          test "${{ needs.e2e-catalog.result }}" = "success"
          chromium="${{ needs.e2e-chromium.result }}"
          firefox_lanes="${{ needs.e2e-firefox-lane.result }}"
          firefox_reconcile="${{ needs.e2e-firefox-reconcile.result }}"
          echo "e2e results: chromium=$chromium firefox-lanes=$firefox_lanes firefox-reconcile=$firefox_reconcile"
          test "$chromium" = "success"
          test "$firefox_lanes" = "success"
          test "$firefox_reconcile" = "success"
