name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run the required checks on merge-queue branches (gh-readonly-queue/…) so the
  # queue can gate on the combined-with-main state. All jobs run on merge_group:
  # both required contexts — "Validate (no e2e)" and "e2e gate" (via its needs) —
  # must report on the queue branch. See docs/ci-merge-queue.md.
  merge_group:

# Runner selection for every job that builds: pin the image, never `ubuntu-latest`.
# `-latest` migrates whenever GitHub rolls the image family, so an unrelated PR is the
# one that discovers the new toolchain — a CI break with no commit that caused it.
# Bumping the pin is then a deliberate, revertable commit. (`ubuntu-latest` ==
# `ubuntu-24.04` as of image 20260720.247, so the pin is behaviour-neutral today;
# `ubuntu-26.04` exists but is still public preview.)
#
# These jobs must also stay x86_64 on a full VM. The test-checks lane's combined
# Emacs coverage producer and the browser E2E checks build NixOS test machines hardcoded
# to `x86_64-linux` (`nix/nixos.nix`'s `interactiveTestingVmSystem` /
# `postgresTestingVmSystem`), and the jaunder-org cachix cache is populated for that
# system only — an arm64 runner would emulate the VM and rebuild the world cold. They
# also need a privileged, long-lived environment for the nix daemon and test VMs,
# which rules out the container-based `ubuntu-slim` tier that the result-only gates
# use below.
jobs:
  validate-host:
    name: Validation host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate host lane (via xtask)
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask ci-validate host
      - name: Preserve host validation result
        if: always()
        run: |
          if test -f .xtask/last-result.json; then
            cp .xtask/last-result.json .xtask/host-result.json
          fi
      - name: Upload host validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-host-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/last-result.json
            .xtask/host-result.json
          if-no-files-found: ignore
          retention-days: 14

  validate-hermetic:
    name: Validation hermetic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate hermetic lane (via xtask)
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask ci-validate
          hermetic
      - name: Preserve hermetic validation result
        if: always()
        run: |
          if test -f .xtask/last-result.json; then
            cp .xtask/last-result.json .xtask/hermetic-result.json
          fi
      - name: Upload hermetic validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-hermetic-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/last-result.json
            .xtask/hermetic-result.json
          if-no-files-found: ignore
          retention-days: 14

  validate-test-checks:
    name: Validation test checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate test checks lane (via xtask)
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask ci-validate
          test-checks
      - name: Build Emacs package for Cachix
        run:
          nix build --accept-flake-config --no-link
          .#emacsPackages.x86_64-linux.jaunder
      - name: Preserve test checks validation result
        if: always()
        run: |
          if test -f .xtask/last-result.json; then
            cp .xtask/last-result.json .xtask/test-checks-result.json
          fi
      # Keep the broad source probe on this Nix-heavy runner so controlled cold
      # changes reuse its realized store instead of rebuilding the closure on a
      # fifth VM. `always()` preserves the independent failure signal when an
      # earlier test-check step fails.
      - name: Nix source-closure drift probe (#1289)
        if: always()
        run: |
          rm -f .xtask/last-result.json
          nix develop .#ci --accept-flake-config -c cargo xtask nix probe-source
      - name: Preserve source probe result
        if: always()
        run: |
          if test -f .xtask/last-result.json; then
            cp .xtask/last-result.json .xtask/source-probe-result.json
          fi
      - name: Upload test checks validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-test-checks-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/gcroots/elisp-coverage-producer/elisp-coverage/
            .xtask/last-result.json
            .xtask/test-checks-result.json
            .xtask/source-probe-result.json
          if-no-files-found: ignore
          retention-days: 14

  validate-coverage:
    name: Validation coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate Rust coverage lane (via xtask)
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask ci-validate
          coverage
      - name: Preserve coverage validation result
        if: always()
        run: |
          if test -f .xtask/last-result.json; then
            cp .xtask/last-result.json .xtask/coverage-result.json
          fi
      # Drift guard for the Nix coverage `src` filter (#241/#37): eval-only, so it
      # reuses this job's nix + cachix + xtask cache for ~seconds. `if: always()` so a
      # filter-drift signal is not masked by an unrelated coverage failure.
      - name: Coverage source-drift probe (#241)
        if: always()
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask coverage
          probe-source
      - name: Upload coverage validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validate-coverage-diagnostics
          path: |
            .xtask/diagnostics/
            .xtask/gcroots/coverage/status.json
            .xtask/gcroots/coverage/diagnostics/
            .xtask/last-result.json
            .xtask/coverage-result.json
          if-no-files-found: ignore
          retention-days: 14

  validate-no-e2e:
    name: Validate (no e2e)
    runs-on: ubuntu-slim
    needs:
      [
        validate-host,
        validate-hermetic,
        validate-test-checks,
        validate-coverage,
      ]
    if: always()
    steps:
      - name: Require all validation lanes to pass
        run: |
          host="${{ needs.validate-host.result }}"
          hermetic="${{ needs.validate-hermetic.result }}"
          test_checks="${{ needs.validate-test-checks.result }}"
          coverage="${{ needs.validate-coverage.result }}"
          echo "validation lane results: host=$host hermetic=$hermetic test-checks=$test_checks coverage=$coverage"
          test "$host" = "success"
          test "$hermetic" = "success"
          test "$test_checks" = "success"
          test "$coverage" = "success"

  e2e:
    name: e2e (${{ matrix.backend }}/${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: e2e (${{ matrix.backend }}/${{ matrix.browser }}, via xtask)
        # xtask surfaces retried-but-passed tests itself: it reads the report it
        # lifts out of the VM, appends a table to $GITHUB_STEP_SUMMARY (inherited
        # env), records them in the sidecar, and prints a `flaky:` sentinel. See
        # xtask/src/steps/flaky.rs.
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask e2e ${{
          matrix.backend }} ${{ matrix.browser }}
      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.backend }}-${{ matrix.browser }}
          path: |
            .xtask/diagnostics/
            .xtask/last-result.json
          if-no-files-found: ignore
          retention-days: 14

  # Disposable issue #1574 measurement jobs. This branch must never merge.
  measure-firefox-control:
    name: measure Firefox control (${{ matrix.backend }}/${{ matrix.workers }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
        workers: [workers2, workers4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Force a fresh control realization
        run: >-
          perl -0pi -e 's/e2eSalt = "";/e2eSalt = "ci-${{ github.run_id }}-${{
          github.run_attempt }}";/ or die "missing e2eSalt\n"' nix/checks.nix
      - name: Run census-bearing unsplit control
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask e2e-control ${{
          matrix.backend }} ${{ matrix.workers }}
      - name: Upload control evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name:
            measure-firefox-control-${{ matrix.backend }}-${{ matrix.workers }}
          path: |
            .xtask/diagnostics/
            .xtask/last-result.json
          if-no-files-found: ignore
          retention-days: 14

  measure-firefox-candidate:
    name: measure Firefox candidate (${{ matrix.backend }}/${{ matrix.lane }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
        lane: [ordinary-1-of-2, ordinary-2-of-2, serial-special]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Force a fresh candidate realization
        run: >-
          perl -0pi -e 's/e2eSalt = "";/e2eSalt = "ci-${{ github.run_id }}-${{
          github.run_attempt }}";/ or die "missing e2eSalt\n"' nix/checks.nix
      - name: Run one isolated candidate lane
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask e2e-candidate
          ${{ matrix.backend }}-firefox-${{ matrix.lane }}
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name:
            measure-firefox-candidate-${{ matrix.backend }}-${{ matrix.lane }}
          path: |
            .xtask/diagnostics/
            .xtask/last-result.json
          if-no-files-found: ignore
          retention-days: 14

  measure-firefox-reconcile:
    name:
      measure Firefox reconcile (${{ matrix.backend }}/${{
      matrix.control-workers }})
    runs-on: ubuntu-24.04
    needs: [measure-firefox-control, measure-firefox-candidate]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
        control-workers: [workers2, workers4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Download candidate evidence
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: measure-firefox-candidate-${{ matrix.backend }}-*
          path: .xtask/measurement/candidates
          merge-multiple: true
      - name: Download control evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name:
            measure-firefox-control-${{ matrix.backend }}-${{
            matrix.control-workers }}
          path: .xtask/measurement/control
      - name: Reconcile candidate and control populations
        run:
          nix develop .#ci --accept-flake-config -c cargo xtask
          e2e-experimental-reconcile ${{ matrix.backend }} --diagnostics-root
          .xtask/measurement/candidates/diagnostics --control-diagnostics-root
          .xtask/measurement/control/diagnostics --control-workers ${{
          matrix.control-workers }}
      - name: Upload aggregate verdict
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name:
            measure-firefox-reconcile-${{ matrix.backend }}-${{
            matrix.control-workers }}
          path: |
            .xtask/last-result.json
            .xtask/measurement/
          if-no-files-found: ignore
          retention-days: 14

  e2e-gate:
    name: e2e gate
    # Result-only gate: no checkout, nix, or build — four lines of shell over the
    # `needs` result, ~3s wall clock. `ubuntu-slim` is 1 vCPU / 5GB in a container
    # on a shared host, so it skips VM boot and is intended for GitHub aggregation
    # jobs like this one.
    #
    # Its three constraints are all satisfied here, and are what to re-check before
    # adding a step: a hard 15-minute cap (we use ~3s); an unprivileged container, so
    # no mounts / Docker-in-Docker / kernel features (we run `test` and `echo`); and a
    # minimal toolset, so nothing beyond coreutils+bash is guaranteed present. Any
    # step that needs a checkout or nix belongs in a different job, not here.
    #
    # Unpinned by necessity — GitHub ships no versioned `ubuntu-slim-*` label. That is
    # tolerable only because the job depends on none of the image's preinstalled
    # software, which is exactly the property the paragraph above protects.
    runs-on: ubuntu-slim
    needs: [e2e]
    if: always()
    steps:
      - name: Require all e2e matrix jobs to pass
        run: |
          e2e="${{ needs.e2e.result }}"
          echo "e2e matrix result: $e2e"
          test "$e2e" = "success"
