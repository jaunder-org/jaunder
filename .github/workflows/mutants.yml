name: Mutants

# Scheduled mutation testing. Deliberately NOT on pull_request.
#
# Cost is why. Each mutant needs its own build and its own workspace test run —
# you cannot test two mutations at once and still attribute the result — so time
# is linear in mutant count, measured at ~42s per mutant on a 16-core
# workstation. Diff-scoping does not bound that: a 20-line refactor in this repo
# generated 49 mutants (~34 min) while an 872-line change generated 34. A
# per-PR gate would therefore cost anywhere from zero to forty minutes with no
# way to predict which before pushing, and a check that unpredictable is one
# people learn to route around.
#
# So this runs on its own schedule, blocks nobody, and reports what it finds.
# The results are a finite work list to burn down, not a score to maintain.

on:
  schedule:
    # Weekly, incremental. Sundays 04:17 UTC — off-peak, and the odd minute
    # avoids the top-of-hour stampede that delays scheduled jobs on GitHub's
    # shared runners. Uses --iterate, so it re-tests only mutants no previous
    # run has caught.
    - cron: "17 4 * * 0"
    # Monthly, FULL. 1st at 03:17 UTC. --iterate is unsound against regressions:
    # it skips anything previously caught, so a test that is later deleted or
    # weakened leaves its mutant skipped forever while the weekly run stays
    # green. The cache records "was caught", not "is still caught". This run
    # ignores the cache and re-tests everything, and is the only thing that
    # notices a test having rotted away.
    #
    # Roughly one month in seven this lands on a Sunday and both crons fire. The
    # concurrency group below serializes them rather than letting them corrupt
    # each other's cache; the full run subsumes the weekly one, so the extra
    # cost is one redundant scan a year or so.
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Cargo package to scan (`all` is what the schedules use)"
        type: choice
        default: all
        options: [all, common, storage, host, jaunder, macros]
      shards:
        description:
          "Override the per-package shard count (blank uses the sized defaults)"
        type: choice
        # Blank => the per-package defaults below, which both schedules share.
        # Overriding this for a one-off run means its results land under a
        # different cache key and will not be seen by the scheduled runs.
        default: ""
        options: ["", "1", "2", "4", "8", "16", "32"]
      full:
        description: >-
          Re-test mutants that a previous run already caught (slow, but the only
          way to notice a test that has rotted away)
        type: boolean
        default: false

# One scan at a time. Two concurrent runs would race on the same result cache
# and each would persist a partial view of the other's work.
concurrency:
  group: mutants-${{ inputs.package || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    # Builds the package × shard matrix, because a GitHub matrix cannot be
    # computed inline. Without this the `shards` input would be accepted and
    # silently ignored — a knob that lies about what it does.
    name: mutants plan
    # `seq` and `jq`, nothing else. ubuntu-slim is 1 vCPU / 5 GB in a container
    # rather than a VM, with a hard 15-minute cap — useless for the shards below,
    # right for this.
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - id: plan
        env:
          # Which cron fired, empty for a manual run. A scheduled event cannot
          # carry inputs — which is exactly why `all` has to be the DEFAULT and
          # not just an option. When this defaulted to `common`, both crons
          # resolved to `common` forever and the other four packages were never
          # scanned on any schedule.
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_SHARDS: ${{ inputs.shards }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail

          # Shard counts sized to each package's mutant population, measured by
          # the discovery loop (.mutants-loop/queue.md): common 580, storage 569,
          # jaunder 315, macros 109, host 87 — 1660 in all. A flat width would
          # either split `host` into shards of five mutants, each paying a full
          # Nix build for a minute of work, or leave `common` in slices too long
          # for the 6-hour job limit on a full audit.
          #
          # Change a number here and that package's result cache is invalidated:
          # the key includes the width, because `--shard k/n` slices differently
          # for a different n. That is deliberate — outcomes from a 4-way split
          # describe different mutants than an 8-way one and must not be mixed —
          # but it does mean the next run re-tests that package from scratch.
          declare -A SIZED=(
            [common]=16 [storage]=16 [jaunder]=8 [macros]=4 [host]=4
          )

          selected="${INPUT_PACKAGE:-all}"
          if [ "$selected" = "all" ]; then
            packages=(common storage jaunder macros host)
          else
            packages=("$selected")
          fi

          # Monthly cron (1st of the month) => full audit. Keep this string in
          # step with the `on.schedule` entry above; they are one decision
          # expressed twice, and only this comment ties them together.
          full=0
          if [ "${INPUT_FULL:-false}" = "true" ] || [ "$SCHEDULE" = "17 3 1 * *" ]; then
            full=1
          fi

          # Shards are ZERO-indexed: cargo-mutants requires k < n in
          # `--shard k/n`. Emitting 1..n instead silently skipped shard 0 and
          # errored on n/n — and because its invalid-argument exit code (2) is
          # the same one it uses for "found surviving mutants", that looked like
          # a clean run and cost an eighth of every package.
          entries=""
          for pkg in "${packages[@]}"; do
            n="${INPUT_SHARDS:-${SIZED[$pkg]}}"
            for k in $(seq 0 $((n - 1))); do
              entries="$entries$(jq -nc --arg p "$pkg" --argjson k "$k" --argjson n "$n" \
                '{package:$p, shard:$k, shards:$n}')"$'\n'
            done
          done
          matrix=$(printf '%s' "$entries" | jq -sc '{include: .}')
          jobs=$(printf '%s' "$entries" | jq -s 'length')

          {
            echo "matrix=$matrix"
            echo "jobs=$jobs"
            echo "full=$full"
          } >>"$GITHUB_OUTPUT"
          echo "packages='${packages[*]}' jobs=$jobs full=$full schedule='${SCHEDULE:-manual}'"
          {
            echo "### mutants plan"
            echo
            echo "packages \`${packages[*]}\` — $jobs shard job(s), full=$full (trigger: ${SCHEDULE:-manual})"
          } >>"$GITHUB_STEP_SUMMARY"

  shard:
    # Start with one package rather than the workspace. 1660 mutants at ~42s is
    # ~19 hours of wall clock on the workstation, and more on a hosted runner —
    # which is why this is sharded across packages rather than run as one
    # workspace scan that could not fit GitHub's 6-hour job limit at any sensible
    # width. `web` and `client` stay out: `client` is WASM-only and no host test
    # reaches it, and `web`'s first pass reported 361 survivors against 157
    # caught, a ratio that was never credible. See .mutants-loop/queue.md.
    name: mutants ${{ matrix.package }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    needs: [plan]
    timeout-minutes: 330 # under GitHub's 360 hard kill, so the upload steps still run
    strategy:
      fail-fast: false # one shard's survivors must not hide another's
      # Every job here is a fresh Nix build plus its slice of mutants, so the
      # whole matrix would otherwise saturate the account's runner allowance and
      # starve the PR checks that people are actually waiting on. This is a
      # scheduled job that blocks nobody; it can take the extra waves.
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The mutants.out directory IS the --iterate state. There is no separate
      # database: cargo-mutants rotates the restored mutants.out to
      # mutants.out.old, reads the previous outcomes from it, and writes a fresh
      # one. Restoring it is the whole of what makes a steady-state run cheap.
      #
      # It only ever accumulates mutants proven CAUGHT or UNVIABLE — measured
      # here as "Iteration excludes 9 previously caught or unviable mutants".
      # Survivors and timeouts are deliberately absent from that list, so both
      # are retested every run. A timeout therefore cannot leave stale or
      # misleading state behind: the mutant is simply left unresolved. Nor can a
      # half-finished run — what it wrote is still true of the mutants it
      # actually got to; you just get fewer skips next time.
      #
      # The one thing this state IS unsound about is regressions: it records
      # "was caught", not "is still caught", so a test later deleted leaves its
      # mutant skipped forever. Only the monthly full run notices that, which is
      # why it ignores this cache entirely.
      #
      # No `save-always`: it is deprecated, and the premise it was added on is
      # not true here. ci-shard.sh exits 0 whenever it tested anything — judging
      # on artifacts and never on the exit code is the point of it — so the
      # ordinary save already covers every run that produced results. The only
      # case it would change is a shard that genuinely broke, and that run's
      # partial state is not worth persisting.
      #
      # The key is run-stamped so each run writes a fresh entry and the
      # restore-keys prefix picks up the most recent one. Keying on the commit
      # would miss constantly; keying on nothing would never update.
      - name: Restore mutation results
        uses: actions/cache@v6
        with:
          # The shard count is part of the key: --shard k/n slices differently for
          # a different n, so outcomes from a 4-way split describe different
          # mutants than an 8-way one and must not be restored across them.
          path: .mutants-ci/${{ matrix.package }}-${{ matrix.shard }}
          key:
            mutants-v1-${{ matrix.package }}-${{ matrix.shards }}-${{
            matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            mutants-v1-${{ matrix.package }}-${{ matrix.shards }}-${{ matrix.shard }}-

      - name: Run mutants
        env:
          # A hosted runner has ~4 cores. Two parallel jobs each running a
          # workspace test suite is what produced 242 false timeouts locally on a
          # 16-core box; do not raise this without re-checking the timeout counts.
          MUTANTS_JOBS: "1"
          MUTANTS_FULL: ${{ needs.plan.outputs.full }}
          # CI is the environment that CAN have PostgreSQL, so it is the one
          # place the postgres code gets mutated at all. A workstation scan
          # filters those tests out and excludes storage/src/postgres with them;
          # here `devtool pg run` provisions a throwaway cluster and exports
          # JAUNDER_PG_TEST_URL, so both come back into scope. See
          # .mutants-loop/common.sh.
          MUTANTS_WITH_POSTGRES: "1"
        run: |
          nix develop .#mutants --accept-flake-config -c \
            devtool pg run -- \
            .mutants-loop/ci-shard.sh \
            "${{ matrix.package }}" \
            "${{ matrix.shard }}" "${{ matrix.shards }}" \
            ".mutants-ci/${{ matrix.package }}-${{ matrix.shard }}"

      - name: Summarize
        if: always()
        run: |
          out=".mutants-ci/${{ matrix.package }}-${{ matrix.shard }}/mutants.out"
          {
            echo "### mutants ${{ matrix.package }} shard ${{ matrix.shard }}/${{ matrix.shards }}"
            echo
            if [ ! -f "$out/outcomes.json" ]; then
              echo "**No outcomes** — nothing was tested. Check the log."
            else
              # These count what THIS run tested. Under --iterate the mutants a
              # previous run proved caught or unviable are excluded up front and
              # so appear in none of them — which is why `caught` shrinks toward
              # zero as a package is burned down, and why `skipped` is reported
              # beside it rather than left to be inferred from a falling number.
              # `missed` is unaffected: survivors are never skipped.
              for f in caught missed unviable timeout; do
                n=0
                [ -s "$out/$f.txt" ] && n=$(wc -l <"$out/$f.txt")
                echo "- $f (this run): $n"
              done
              skipped=0
              [ -s "$out/previously_caught.txt" ] && skipped=$(wc -l <"$out/previously_caught.txt")
              echo "- skipped (already caught or unviable): $skipped"
              if [ -s "$out/timeout.txt" ]; then
                echo
                echo "> **$(wc -l <"$out/timeout.txt") mutant(s) timed out and were never examined.**"
                echo "> Neither caught nor missed — a hole in the scan, not a result."
              fi
              if [ -s "$out/missed.txt" ]; then
                echo
                echo "<details><summary>Surviving mutants</summary>"
                echo
                echo '```'
                cat "$out/missed.txt"
                echo '```'
                echo
                echo "</details>"
              fi
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-${{ matrix.package }}-${{ matrix.shard }}
          path: |
            .mutants-ci/*/mutants.out/missed.txt
            .mutants-ci/*/mutants.out/caught.txt
            .mutants-ci/*/mutants.out/unviable.txt
            .mutants-ci/*/mutants.out/timeout.txt
            .mutants-ci/*/mutants.out/outcomes.json
            .mutants-ci/*/mutants.out/previously_caught.txt
          # `.mutants-ci` is a DOT directory, and upload-artifact skips hidden
          # paths by default. Without this every shard uploads nothing, the
          # report job counts zero survivors, and the whole workflow is green
          # while testing nothing.
          include-hidden-files: true
          # An empty upload is the failure mode above wearing a disguise. The
          # shard script already refuses to exit 0 without outcomes.json, so
          # reaching here with no files means something else went wrong.
          if-no-files-found: error
          retention-days: 90

  report:
    name: mutants report
    # Downloads artifacts and counts lines. Same reasoning as `plan`.
    runs-on: ubuntu-slim
    needs: [plan, shard]
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mutants-*
          # NOT merge-multiple: each shard's files keep their own directory, so
          # one shard's missed.txt cannot overwrite another's.
          path: results
      - name: Judge the scan
        env:
          EXPECTED_SHARDS: ${{ needs.plan.outputs.jobs }}
        run: |
          # Judge on artifacts, never on cargo-mutants' exit code: it uses 2 both
          # for "found surviving mutants" and for an invalid argument.
          #
          # Collect with `find`, NOT a glob. upload-artifact roots an artifact at
          # the non-wildcard prefix of its search pattern — `.mutants-ci/` — and
          # not at the least common ancestor of the files it matched. So an
          # artifact arrives as results/<artifact>/<pkg>-<shard>/mutants.out/,
          # two levels deeper than the obvious guess. A glob has to hard-code that
          # depth, and when it guesses wrong it does not error: it matches nothing
          # and reports zero survivors. That already happened once, in run
          # 31554388604, where 32 real survivors counted as none. `find` does not
          # care how deep the tree is.
          mapfile -t outcomes < <(find results -name outcomes.json)
          if [ "${#outcomes[@]}" -eq 0 ]; then
            echo "::error::no shard artifacts — nothing was tested"
            echo "**No shard results.** Nothing was tested." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # A missing shard is a hole, not a clean result: the survivors it would
          # have reported are simply absent, and the count below still looks like
          # an answer.
          if [ "${#outcomes[@]}" -ne "$EXPECTED_SHARDS" ]; then
            echo "::error::${#outcomes[@]} of $EXPECTED_SHARDS shards reported — the rest were never examined"
            echo "**Incomplete:** ${#outcomes[@]}/$EXPECTED_SHARDS shards reported." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          count() { find results -name "$1.txt" -exec cat {} + | grep -c . || true; }
          missed=$(count missed)
          timeout=$(count timeout)
          echo "shards=${#outcomes[@]} caught=$(count caught) missed=$missed unviable=$(count unviable) timeout=$timeout skipped=$(count previously_caught)"

          # Which package a survivor is in is the first thing anyone asks, and
          # the run now spans five of them. The artifact directory carries it.
          #
          # `caught` and `unviable` count what this run TESTED. Under --iterate
          # the mutants a previous run proved caught or unviable are excluded up
          # front, so they appear in neither — `caught` falls toward zero as a
          # package is burned down, and that is success, not regression. Only the
          # monthly full run reports totals. `missed` is a complete survivor list
          # either way, because survivors are never skipped.
          {
            echo "### mutants: $missed surviving"
            echo
            echo "$(count caught) caught, $(count unviable) unviable, $(count previously_caught) skipped (all counts for mutants tested this run)"
            echo
            for dir in results/mutants-*; do
              pkg=${dir#results/mutants-}
              echo "${pkg%-*}"
            done | sort -u | while read -r pkg; do
              n=$(find results -path "results/mutants-$pkg-*" -name missed.txt -exec cat {} + | grep -c . || true)
              echo "- \`$pkg\`: $n surviving"
            done
          } >>"$GITHUB_STEP_SUMMARY"

          # A timeout is not a result, it is a hole. The mutant was neither caught
          # nor missed, so it went unexamined while the totals above still read
          # like an answer — the same defect as a missing shard, which is already
          # fatal here. Reported separately from survivors because the fix is
          # different: a survivor is a missing test, a timeout is the timeout
          # value or the runner. Locally these came in floods (83 of common's 507)
          # whenever two mutant jobs shared a box; CI runs MUTANTS_JOBS=1 to avoid
          # exactly that, so a timeout here means the assumption has broken.
          if [ "$timeout" -gt 0 ]; then
            echo "::error::$timeout mutant(s) timed out and were never examined — the scan is incomplete"
            {
              echo
              echo "> **Incomplete scan: $timeout mutant(s) timed out.**"
              echo "> Neither caught nor missed — they went unexamined. This is a"
              echo "> measurement failure, not a finding: check MUTANTS_JOBS and the"
              echo "> \`--timeout\` in .mutants-loop/common.sh, not the tests."
              echo
              echo '```'
              find results -name timeout.txt -exec cat {} +
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

          if [ "$missed" -gt 0 ]; then
            {
              echo
              echo "<details><summary>All $missed surviving mutants</summary>"
              echo
              echo '```'
              find results -name missed.txt -exec cat {} +
              echo '```'
              echo
              echo "</details>"
            } >>"$GITHUB_STEP_SUMMARY"
          fi

          # One exit, after both have had their say: a run with survivors AND
          # timeouts must report both, not stop at whichever was checked first.
          if [ "$missed" -gt 0 ] || [ "$timeout" -gt 0 ]; then
            exit 1
          fi
          echo "No surviving mutants, no timeouts." >>"$GITHUB_STEP_SUMMARY"
