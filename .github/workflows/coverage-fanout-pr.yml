name: Coverage fan-out PR evaluation

on:
  pull_request:
    types: [opened, synchronize]

# One opt-in evaluation run on the experiment PR. The calls are serialized so
# the first fan-out observes a support-cache miss and later calls observe reuse.
jobs:
  baseline-cold:
    uses: ./.github/workflows/coverage-fanout-measurement.yml
    secrets: inherit
    with:
      observation-id: baseline-cold-a
      mode: baseline
      strategy: hash
      concurrency: independent
      cache-state: cold
      order: "1"
      comparison-order: A

  fanout-cold:
    needs: baseline-cold
    uses: ./.github/workflows/coverage-fanout-measurement.yml
    secrets: inherit
    with:
      observation-id: fanout-cold-a
      mode: fanout
      strategy: hash
      concurrency: independent
      cache-state: cold
      order: "2"
      comparison-order: A

  fanout-warm-a:
    needs: fanout-cold
    uses: ./.github/workflows/coverage-fanout-measurement.yml
    secrets: inherit
    with:
      observation-id: fanout-warm-a
      mode: fanout
      strategy: hash
      concurrency: independent
      cache-state: warm
      order: "3"
      comparison-order: B

  baseline-warm-a:
    needs: fanout-warm-a
    uses: ./.github/workflows/coverage-fanout-measurement.yml
    secrets: inherit
    with:
      observation-id: baseline-warm-a
      mode: baseline
      strategy: hash
      concurrency: independent
      cache-state: warm
      order: "4"
      comparison-order: B

  baseline-warm-b:
    needs: baseline-warm-a
    uses: ./.github/workflows/coverage-fanout-measurement.yml
    secrets: inherit
    with:
      observation-id: baseline-warm-b
      mode: baseline
      strategy: hash
      concurrency: independent
      cache-state: warm
      order: "5"
      comparison-order: A

  fanout-warm-b:
    needs: baseline-warm-b
    uses: ./.github/workflows/coverage-fanout-measurement.yml
    secrets: inherit
    with:
      observation-id: fanout-warm-b
      mode: fanout
      strategy: hash
      concurrency: independent
      cache-state: warm
      order: "6"
      comparison-order: A
