name: Coverage fan-out measurement

on:
  workflow_call:
    inputs:
      observation-id:
        description: Stable artifact identity within the parent workflow.
        required: true
        type: string
      mode:
        required: true
        type: string
      strategy:
        required: true
        type: string
      concurrency:
        required: true
        type: string
      cache-state:
        required: true
        type: string
      order:
        required: true
        type: string
      comparison-order:
        required: true
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      observation-id:
        description: Stable artifact identity within this workflow run.
        required: true
        type: string
      mode:
        description: One observation using the current baseline or two-worker fan-out.
        required: true
        type: choice
        options: [baseline, fanout]
      strategy:
        description: Fan-out strategy; ignored for baseline and backend remains measurement-only.
        required: true
        type: choice
        options: [slice, hash, backend]
      concurrency:
        description: Per-worker concurrency policy; ignored for baseline.
        required: true
        type: choice
        options: [independent, fixed]
      cache-state:
        description: Declared cold or warm support-cache state.
        required: true
        type: choice
        options: [cold, warm]
      order:
        description: Ordinal in the controller's counterbalanced sequence.
        required: true
        type: string
      comparison-order:
        description: Counterbalanced sequence identifier.
        required: true
        type: string

# Dispatch-only and non-required. ci.yml remains the authoritative per-ref producer.
env:
  JAUNDER_COVERAGE_MEASUREMENT_CACHE_BUSTER: ${{ github.sha }}

jobs:
  baseline:
    name: Coverage baseline observation
    if: ${{ inputs.mode == 'baseline' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - id: coverage
        name: Execute current uncached final coverage producer
        shell: bash
        run: |
          started=$(date +%s%3N)
          result=failure
          if nix build --accept-flake-config --print-build-logs .#checks.x86_64-linux.coverage --out-link coverage-baseline >baseline-realization.out 2>baseline-realization.err; then
            result=success
          fi
          finished=$(date +%s%3N)
          echo "elapsed_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
          test "$result" = success
      - name: Package baseline observation
        if: always()
        shell: bash
        env:
          ELAPSED_MS: ${{ steps.coverage.outputs.elapsed_ms }}
        run: |
          mkdir -p coverage-observation
          if test -e coverage-baseline; then
            cp -Lr coverage-baseline coverage-observation/aggregate
          fi
          cp baseline-realization.out baseline-realization.err coverage-observation/
          jq -n \
            --arg schema coverage-ci-fanout-observation-v1 \
            --arg observation_id "${{ inputs.observation-id }}" \
            --arg revision "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg image_os "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg flake_lock_sha "$(sha256sum flake.lock | cut -d' ' -f1)" \
            --arg nix "$(nix --version)" \
            --arg cache_state "${{ inputs['cache-state'] }}" \
            --arg order "${{ inputs.order }}" \
            --arg comparison_order "${{ inputs['comparison-order'] }}" \
            --arg elapsed_ms "$ELAPSED_MS" \
            '{schema:$schema,observation_id:$observation_id,revision:$revision,ref:$ref,run_url:$run_url,runner:{os:$runner_os,arch:$runner_arch,image_os:$image_os,image_version:$image_version},toolchain:{nix:$nix,flake_lock_sha256:$flake_lock_sha},mode:"baseline",strategy:"baseline",concurrency:"not-applicable",declared_cache_state:$cache_state,final_output_cache_state:"forced-uncached",order:$order,comparison_order:$comparison_order,stages:{producer_elapsed_ms:$elapsed_ms}}' > coverage-observation/observation.json
      - name: Upload baseline observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline-observation-v1-${{ inputs.observation-id }}
          path: coverage-observation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  prepare-support:
    name: Prepare coverage support
    if: ${{ inputs.mode == 'fanout' }}
    runs-on: ubuntu-24.04
    outputs:
      elapsed_ms: ${{ steps.support.outputs.elapsed_ms }}
      actual_cache_state: ${{ steps.support.outputs.actual_cache_state }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - id: support
        name: Prepare support once and verify cache state
        shell: bash
        run: |
          support_path=$(nix eval --impure --raw .#packages.x86_64-linux.coverage-support.outPath)
          actual=cold
          if nix path-info --store https://jaunder-org.cachix.org "$support_path" >support-cache-probe.out 2>support-cache-probe.err; then
            actual=warm
          fi
          echo "actual_cache_state=$actual" >> "$GITHUB_OUTPUT"
          test "$actual" = "${{ inputs['cache-state'] }}"
          started=$(date +%s%3N)
          result=failure
          if nix build --impure --accept-flake-config --print-build-logs .#packages.x86_64-linux.coverage-support --out-link coverage-support >support-realization.out 2>support-realization.err; then
            result=success
          fi
          finished=$(date +%s%3N)
          echo "elapsed_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
          test "$result" = success
      - name: Stage dereferenced immutable support
        shell: bash
        env:
          ELAPSED_MS: ${{ steps.support.outputs.elapsed_ms }}
          ACTUAL_CACHE_STATE: ${{ steps.support.outputs.actual_cache_state }}
        run: |
          cp -Lr --no-preserve=mode coverage-support coverage-support-transfer
          cp support-cache-probe.out support-cache-probe.err support-realization.out support-realization.err coverage-support-transfer/
          jq -n --arg elapsed_ms "$ELAPSED_MS" --arg cache_state "$ACTUAL_CACHE_STATE" '{preparation_elapsed_ms:$elapsed_ms,actual_cache_state:$cache_state}' > coverage-support-transfer/measurement.json
      - name: Transfer immutable support
        uses: actions/upload-artifact@v7
        with:
          name: coverage-support-${{ inputs.observation-id }}
          path: coverage-support-transfer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  worker:
    name: Coverage worker ${{ matrix.worker }}/2
    if: ${{ inputs.mode == 'fanout' }}
    runs-on: ubuntu-24.04
    needs: prepare-support
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: coverage-support-${{ inputs.observation-id }}
          path: coverage-support
      - id: worker
        name: Execute one uncached per-ref worker
        shell: bash
        run: |
          started=$(date +%s%3N)
          sudo mkdir -p /build
          sudo ln -s "$GITHUB_WORKSPACE" /build/source
          tar -xf coverage-support/runtime-site.tar
          result=failure
          if nix develop .#ci --accept-flake-config -c devtool coverage experiment-worker --out coverage-worker --strategy "${{ inputs.strategy }}" --concurrency "${{ inputs.concurrency }}" --worker "${{ matrix.worker }}" --census coverage-support/census.json --archive-file coverage-support/tests.tar.zst >worker-command.out 2>worker-command.err; then
            result=success
          fi
          finished=$(date +%s%3N)
          mkdir -p coverage-worker
          cp worker-command.out worker-command.err coverage-worker/
          jq -n --arg elapsed_ms "$((finished - started))" --arg runner_os "$RUNNER_OS" --arg runner_arch "$RUNNER_ARCH" '{worker_elapsed_ms:$elapsed_ms,runner:{os:$runner_os,arch:$runner_arch}}' > coverage-worker/measurement.json
          test "$result" = success
      - name: Upload terminal worker bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-worker-${{ matrix.worker }}-${{ inputs.observation-id }}
          path: coverage-worker/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Coverage fan-out aggregate
    if: ${{ always() && inputs.mode == 'fanout' }}
    runs-on: ubuntu-24.04
    needs: [prepare-support, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: coverage-worker-1-${{ inputs.observation-id }}
          path: worker-one
      - uses: actions/download-artifact@v8
        with:
          name: coverage-worker-2-${{ inputs.observation-id }}
          path: worker-two
      - uses: actions/download-artifact@v8
        with:
          name: coverage-support-${{ inputs.observation-id }}
          path: coverage-support
      - id: aggregate
        name: Produce one uncached aggregate verdict
        shell: bash
        run: |
          started=$(date +%s%3N)
          sudo mkdir -p /build
          sudo ln -s "$GITHUB_WORKSPACE" /build/source
          result=failure
          if nix develop .#ci --accept-flake-config -c devtool coverage experiment-aggregate --out coverage-aggregate --census coverage-support/census.json --archive-file coverage-support/tests.tar.zst --worker-bundle worker-one worker-two >aggregate-command.out 2>aggregate-command.err; then
            result=success
          fi
          finished=$(date +%s%3N)
          echo "elapsed_ms=$((finished - started))" >> "$GITHUB_OUTPUT"
          test "$result" = success
      - name: Validate aggregate status
        run: nix develop .#ci --accept-flake-config -c devtool coverage validate-status --status coverage-aggregate/status.json
      - name: Package versioned observation
        if: always()
        shell: bash
        env:
          AGGREGATE_ELAPSED_MS: ${{ steps.aggregate.outputs.elapsed_ms }}
          PREPARATION_ELAPSED_MS: ${{ needs.prepare-support.outputs.elapsed_ms }}
          ACTUAL_CACHE_STATE: ${{ needs.prepare-support.outputs.actual_cache_state }}
        run: |
          mkdir -p coverage-observation
          if test -e coverage-aggregate; then
            cp -r coverage-aggregate coverage-observation/aggregate
          fi
          cp aggregate-command.out aggregate-command.err coverage-observation/
          mkdir -p coverage-observation/worker-one coverage-observation/worker-two coverage-observation/coverage-support
          cp worker-one/{worker.json,measurement.json,census.json,junit.xml,worker-command.out,worker-command.err} coverage-observation/worker-one/
          cp worker-two/{worker.json,measurement.json,census.json,junit.xml,worker-command.out,worker-command.err} coverage-observation/worker-two/
          cp -r worker-one/diagnostics coverage-observation/worker-one/
          cp -r worker-two/diagnostics coverage-observation/worker-two/
          cp coverage-support/{measurement.json,census.json,cargo-metadata.json,nextest.toml,support-cache-probe.out,support-cache-probe.err,support-realization.out,support-realization.err} coverage-observation/coverage-support/
          jq -n \
            --arg schema coverage-ci-fanout-observation-v1 \
            --arg observation_id "${{ inputs.observation-id }}" \
            --arg revision "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg image_os "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg flake_lock_sha "$(sha256sum flake.lock | cut -d' ' -f1)" \
            --arg nix "$(nix --version)" \
            --arg strategy "${{ inputs.strategy }}" \
            --arg concurrency "${{ inputs.concurrency }}" \
            --arg declared_cache_state "${{ inputs['cache-state'] }}" \
            --arg actual_cache_state "$ACTUAL_CACHE_STATE" \
            --arg order "${{ inputs.order }}" \
            --arg comparison_order "${{ inputs['comparison-order'] }}" \
            --arg preparation_elapsed_ms "$PREPARATION_ELAPSED_MS" \
            --arg aggregate_elapsed_ms "$AGGREGATE_ELAPSED_MS" \
            '{schema:$schema,observation_id:$observation_id,revision:$revision,ref:$ref,run_url:$run_url,runner:{os:$runner_os,arch:$runner_arch,image_os:$image_os,image_version:$image_version},toolchain:{nix:$nix,flake_lock_sha256:$flake_lock_sha},mode:"fanout",strategy:$strategy,concurrency:$concurrency,declared_cache_state:$declared_cache_state,actual_cache_state:$actual_cache_state,order:$order,comparison_order:$comparison_order,stages:{preparation_elapsed_ms:$preparation_elapsed_ms,aggregate_elapsed_ms:$aggregate_elapsed_ms}}' > coverage-observation/observation.json
      - name: Upload versioned observation bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-fanout-observation-v1-${{ inputs.observation-id }}
          path: coverage-observation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
