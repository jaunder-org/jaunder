name: Setup CI

description: Install Nix, configure Cachix, and cache the host tools build.

inputs:
  github-token:
    description: GitHub token passed to cachix/install-nix-action.
    required: true
  cachix-auth-token:
    description: Cachix auth token used to push build products.
    required: true
  cargo-cache:
    description:
      Restore and save Cargo's downloaded registry and Git sources, for jobs
      that run host Cargo.
    default: "false"

runs:
  using: composite
  steps:
    # First, so a root `dev` span can show the job's time before it
    # (`jaunder.ci.job_start_ns`). Only "Set up job" and checkout precede it.
    - name: Mark the job start for dev traces
      shell: bash
      run: echo "JAUNDER_CI_JOB_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"
    - uses: cachix/install-nix-action@v31
      with:
        # install-nix-action writes `always-allow-substitutes = true`, which
        # would let CI fetch the Rust coverage and e2e verdicts that
        # `nonSubstitutable` marks `allowSubstitutes = false`. Turning it off
        # makes every tested commit execute them, as it does locally.
        extra_nix_config: |
          experimental-features = nix-command flakes
          always-allow-substitutes = false
        github_access_token: ${{ inputs.github-token }}
    - uses: cachix/cachix-action@v17
      with:
        name: jaunder-org
        authToken: ${{ inputs.cachix-auth-token }}
        # Push build products and static verdicts to the cache, but keep every
        # `jaunder-coverage*` and `jaunder-e2e*` output, support included, out
        # of it. A second layer: the setting above and `dev`'s check that each
        # verdict was built here are what keep those verdicts executing.
        pushFilter: "jaunder-coverage|jaunder-e2e"
    # `dev` runs host tools from Cachix-served Nix packages, so no compiled
    # output is cached here. Jobs that still run host Cargo cache only its
    # downloads, which the lockfiles fully determine.
    - name: Cache Cargo downloads
      if: inputs.cargo-cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key:
          cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/Cargo.lock')
          }}
        restore-keys: |
          cargo-${{ runner.os }}-
