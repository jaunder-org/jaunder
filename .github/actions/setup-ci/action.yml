name: Setup CI

description: Install Nix, configure Cachix, and cache the xtask host build.

inputs:
  github-token:
    description: GitHub token passed to cachix/install-nix-action.
    required: true
  cachix-auth-token:
    description: Cachix auth token used to push build products.
    required: true

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
        github_access_token: ${{ inputs.github-token }}
    - uses: cachix/cachix-action@v17
      with:
        name: jaunder-org
        authToken: ${{ inputs.cachix-auth-token }}
        # The cache-safety probe reconciles this actual-store-name regular
        # expression with nix/cache-policy.json and rejects any final identity
        # that escapes it. Cataloged support closures are separately proven not
        # to contain a final result, so only those support outputs may upload.
        pushFilter: "(?:^|/)[0-9a-z]{32}-jaunder-coverage(?:-[0-9][0-9A-Za-z.+-]*)?(?:\\.drv)?$|(?:^|/)[0-9a-z]{32}-jaunder-coverage-gate(?:\\.drv)?$|(?:^|/)[0-9a-z]{32}-(?:jaunder|vm-test-run-jaunder)-e2e-(?:checks|postgres-(?:chromium|firefox)(?:-single-worker)?|sqlite-(?:chromium|firefox)(?:-single-worker)?)(?:\\.drv)?$"
    # xtask is host-only, so cachix can't cover it; cache its compiled deps
    # between runs.
    - name: Cache xtask host build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          xtask/target
        key:
          xtask-${{ runner.os }}-${{ hashFiles('xtask/Cargo.lock', 'flake.lock')
          }}
        restore-keys: |
          xtask-${{ runner.os }}-
