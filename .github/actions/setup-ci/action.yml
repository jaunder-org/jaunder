name: Setup CI

description: Install Nix, configure Cachix, and cache the host tools build.

inputs:
  github-token:
    description: GitHub token passed to cachix/install-nix-action.
    required: true
  cachix-auth-token:
    description: Cachix auth token used to push build products.
    required: true

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
        github_access_token: ${{ inputs.github-token }}
    - uses: cachix/cachix-action@v17
      with:
        name: jaunder-org
        authToken: ${{ inputs.cachix-auth-token }}
        # Push build products to the cache, but not coverage or e2e outputs.
        # The structural probe proves which support outputs could be admitted;
        # the measured decision report records why the broad boundary remains.
        pushFilter: "jaunder-coverage|jaunder-e2e"
    # Host tools run through `cargo run` from the tools workspace, so cachix
    # can't cover them; cache their compiled deps between runs.
    - name: Cache host tools build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          tools/target
        key:
          tools-${{ runner.os }}-${{ hashFiles('tools/Cargo.lock', 'flake.lock')
          }}
        restore-keys: |
          tools-${{ runner.os }}-
