name: Setup CI

description: Install Nix, configure Cachix, and cache the host tools build.

inputs:
  github-token:
    description: GitHub token passed to cachix/install-nix-action.
    required: true
  cachix-auth-token:
    description: Cachix auth token used to push build products.
    required: true
  compile-cache:
    description:
      Restore the newest kache store saved by `main`. Only the job that compiles
      the product workspace on the host turns this on; it saves the store
      itself.
    default: "false"

runs:
  using: composite
  steps:
    # First, so a root `dev` span can show the job's time before it
    # (`jaunder.ci.job_start_ns`). Only "Set up job" and checkout precede it.
    - name: Mark the job start for dev traces
      shell: bash
      run: echo "JAUNDER_CI_JOB_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
        github_access_token: ${{ inputs.github-token }}
    - uses: cachix/cachix-action@v17
      with:
        name: jaunder-org
        authToken: ${{ inputs.cachix-auth-token }}
        # Push build products and static verdicts to the cache, but not coverage
        # or e2e outputs. This filter is what keeps those verdicts executing in
        # CI: install-nix-action sets `always-allow-substitutes = true`, which
        # overrides their `allowSubstitutes = false`. The structural probe
        # proves which support outputs could be admitted; the measured decision
        # report records why the broad boundary remains.
        pushFilter: "jaunder-coverage|jaunder-e2e"
    # Host tools are built from the tools workspace by `dev`, so cachix
    # can't cover them; cache their compiled deps between runs.
    - name: Cache host tools build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          tools/target
        key:
          tools-${{ runner.os }}-${{ hashFiles('tools/Cargo.lock', 'flake.lock')
          }}
        restore-keys: |
          tools-${{ runner.os }}-
    # kache's store stays in its default location; only the daemon's socket
    # and locks move, so they never enter the saved archive.
    - name: Configure compile cache
      if: inputs.compile-cache == 'true'
      shell: bash
      run: echo "KACHE_RUNTIME_DIR=$HOME/.cache/kache-run" >> "$GITHUB_ENV"
    - name: Restore compile cache
      if: inputs.compile-cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/kache
        key:
          kache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          kache-${{ runner.os }}-
