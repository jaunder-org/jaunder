name: Setup CI

description: Install Nix, configure Cachix, and cache the xtask host build.

inputs:
  github-token:
    description: GitHub token passed to cachix/install-nix-action.
    required: true
  cachix-auth-token:
    description: Cachix auth token used to push build products.
    required: true

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
        github_access_token: ${{ inputs.github-token }}
    - id: cache-policy
      shell: bash
      run: >-
        echo "push-filter=$(jq -r '.excludedNameFragments | join("|")'
        nix/cache-policy.json)" >> "$GITHUB_OUTPUT"
    - uses: cachix/cachix-action@v17
      with:
        name: jaunder-org
        authToken: ${{ inputs.cachix-auth-token }}
        # The inventory uses this same policy file. Test-result derivations remain
        # excluded so CI always executes their current-ref verdict.
        pushFilter: ${{ steps.cache-policy.outputs.push-filter }}
    # xtask is host-only, so cachix can't cover it; cache its compiled deps
    # between runs.
    - name: Cache xtask host build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          xtask/target
        key:
          xtask-${{ runner.os }}-${{ hashFiles('xtask/Cargo.lock', 'flake.lock')
          }}
        restore-keys: |
          xtask-${{ runner.os }}-
