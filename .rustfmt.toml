# `style_edition` is pinned explicitly rather than left to track `edition`:
# `cargo fmt` passes each crate's *manifest* edition to rustfmt (overriding the
# `edition` line below), and an unpinned `style_edition` defaults to whatever
# edition is in force — so formatting style would silently follow the crate
# edition (#826). Pinning keeps the two decisions separate: a future edition move
# changes the language, not the formatting, unless someone edits this line.
edition = "2024"
style_edition = "2024"
