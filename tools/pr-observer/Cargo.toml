[package]
name = "pr-observer"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
processkit = "3.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Maintained YAML-org successor; preserve the existing Serde/Value API (#1939).
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "time"] }
tempfile = "3.27.0"
