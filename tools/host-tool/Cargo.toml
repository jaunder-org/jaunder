[package]
name = "host-tool"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
# Reserve the real stdout for the report (dup/dup2 without unsafe code).
rustix = { version = "1.1.6", features = ["stdio"] }

[dev-dependencies]
tempfile = "3.27.0"
