[package]
name = "qualification"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Production-baseline qualification: harness/source/target admission, lease and
# VM custody, and ordinary/styling/no-evidence publication. Its only executable
# is the host-run `qualification-host`; it never executes inside a derivation.
[[bin]]
name = "qualification-host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
common = { path = "../../common" }
flate2 = "1.1.10"
host = { path = "../../host" }
jsonschema = { version = "0.40", default-features = false }
regex = "1.12.3"
repository-policy = { path = "../repository-policy" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
# Safe OS-provided lease flags and effective UID, without numeric flag tables,
# /proc parsing for user identity, or shelling out to id.
rustix = { version = "1.1.6", features = ["fs", "process", "time"] }

[dev-dependencies]
# Closed synthetic releases are used only by canonical adapter unit fixtures.
host = { path = "../../host", features = ["qualification"] }
