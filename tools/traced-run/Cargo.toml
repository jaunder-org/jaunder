[package]
name = "traced-run"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "traced_run"
path = "src/lib.rs"

[[bin]]
name = "traced-run"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
processkit = "3.3.4"
rustix = { version = "1.1.4", features = ["time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
signal-hook = "0.4.4"
