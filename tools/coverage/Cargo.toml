[package]
name = "coverage"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
quick-xml = "0.42.0"
tempfile = { version = "3.27.0", optional = true }
signal-hook = { version = "0.4.4", optional = true }
# Host-run evidence consumers (`coverage-check`); the sandbox producer omits them.
clap = { version = "4.6.6", features = ["derive"], optional = true }
flate2 = { version = "1.1.10", optional = true }
host = { path = "../../host", optional = true }
jiff = { version = "0.2.35", default-features = false, features = ["std"], optional = true }
proc-macro2 = { version = "1.0.107", features = ["span-locations"], optional = true }
repository-policy = { path = "../repository-policy", optional = true }
sha2 = { version = "0.11.0", optional = true }
syn = { version = "2", features = ["full", "visit", "extra-traits"], optional = true }
tar = { version = "0.4.46", optional = true }

[features]
# Throwaway PostgreSQL custody shared by the coverage producer and the focused
# `pg run` frontdoor. Nondefault so evidence-only consumers stay process-free.
ephemeral-postgres = ["dep:tempfile", "dep:signal-hook"]
host = [
  "dep:clap",
  "dep:flate2",
  "dep:host",
  "dep:jiff",
  "dep:proc-macro2",
  "dep:repository-policy",
  "dep:sha2",
  "dep:syn",
  "dep:tar",
  "dep:tempfile",
]

[[bin]]
name = "coverage-check"
path = "src/bin/coverage-check.rs"
required-features = ["host"]
