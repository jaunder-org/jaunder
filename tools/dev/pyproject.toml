[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dev"
version = "0.1.0"
description = "Jaunder developer, hook, CI and sandbox workflows with step tracing"
requires-python = ">=3.14"
# Versions come from the pinned nixpkgs (nix/packages.nix `devPythonDeps`).
dependencies = ["click", "opentelemetry-api", "opentelemetry-sdk"]

[project.scripts]
dev = "dev.__main__:main"

[tool.setuptools]
packages = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keep host runs from leaving a cache directory in the checkout.
addopts = ["-p", "no:cacheprovider", "-n", "auto"]

# Ruff reads only a pyproject.toml with this table, which makes this directory
# its project root wherever it runs, so first-party imports sort the same on
# the host and in the Nix check.
[tool.ruff]

# The CLI tests drive `dev` as real processes, so coverage follows them into
# subprocesses.
[tool.coverage.run]
branch = true
source = ["dev"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
show_missing = true
