[package]
name = "host-proof"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "test-local"
path = "src/bin/test-local.rs"

[[bin]]
name = "e2e-local"
path = "src/bin/e2e-local.rs"

[[bin]]
name = "pg-run"
path = "src/bin/pg-run.rs"

[[bin]]
name = "e2e-evidence"
path = "src/bin/e2e-evidence.rs"

[[bin]]
name = "wasm-audit"
path = "src/bin/wasm-audit.rs"

[[bin]]
name = "source-diagnostics"
path = "src/bin/source-diagnostics.rs"

[[bin]]
name = "trace-analysis"
path = "src/bin/trace-analysis.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
coverage = { path = "../coverage", features = ["ephemeral-postgres"] }
flate2 = "1.1.10"
host = { path = "../../host" }
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
processkit = "3.3.4"
regex = "1.12.3"
repository-policy = { path = "../repository-policy" }
# Wasm bundle attribution (#836): section spans, the name section and demangling.
rustc-demangle = "0.1.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tabled = "0.22.0"
tar = "0.4.46"
tempfile = "3.27.0"
# e2e-local bridges processkit's async supervision into synchronous lifecycle
# steps; a background worker keeps process I/O pumps live between calls.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
wasmparser = "0.258.0"
xshell = "0.2.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process", "time"] }

[dev-dependencies]
# Maintained YAML-org successor for CI workflow contract tests (#1939).
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
# Synthesizes the fixture modules the attribution tests parse.
wasm-encoder = "0.258.0"
host = { path = "../../host", features = ["qualification"] }
