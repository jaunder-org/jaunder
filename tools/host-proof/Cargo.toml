[package]
name = "host-proof"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "e2e-evidence"
path = "src/bin/e2e-evidence.rs"

[[bin]]
name = "source-diagnostics"
path = "src/bin/source-diagnostics.rs"

[[bin]]
name = "trace-analysis"
path = "src/bin/trace-analysis.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.10"
host = { path = "../../host" }
regex = "1.12.3"
repository-policy = { path = "../repository-policy" }
host-tool = { path = "../host-tool" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tabled = "0.22.0"
tar = "0.4.46"
tempfile = "3.27.0"
url = "2.5.9"

[dev-dependencies]
# Maintained YAML-org successor for CI workflow contract tests (#1939).
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
