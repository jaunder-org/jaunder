[package]
name = "system-artifacts"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Internal-only A/B styling artifact production for the system-artifact
# qualification packages. Normal and public package outputs omit it.
qualification = ["host/qualification"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
# Stages the closed system styling inventory before the CSR shell renders. A
# host-only build dependency, never a wasm dependency.
host = { path = "../../host" }
