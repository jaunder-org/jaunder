[package]
name = "devtool"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The ordinary/full devtool owns CSR and system-artifact production. The
# docs-only `--no-default-features` tool intentionally excludes this host-heavy
# capability and remains a lightweight documentation authority.
default = ["performance", "system-artifacts"]
performance = ["dep:common", "dep:jiff", "dep:performance", "dep:storage"]
system-artifacts = ["dep:host"]
# Internal-only A/B styling artifact production for the Task 5 qualification
# derivation. Normal devtool and public package outputs omit this capability.
qualification = ["system-artifacts", "host/qualification"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
sha2 = "0.11.0"
coverage = { path = "../coverage" }
doctests = { path = "../doctests" }
tempfile = "3.27.0"
signal-hook = "0.4.4"
brotli = "9.0.0"
flate2 = "1.1.10"
processkit = "3.3.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
csr_bundle = { path = "../csr_bundle" }
oxc_allocator = "0.149.0"
oxc_ast = "0.149.0"
oxc_ast_visit = "0.149.0"
oxc_parser = "0.149.0"
oxc_span = "0.149.0"
performance = { path = "../performance", optional = true }
storage = { path = "../../storage", optional = true }
common = { path = "../../common", optional = true }
jiff = { version = "0.2.21", optional = true }
# The CSR bundle stages the closed system styling inventory before rendering its
# shell. This is a host-only build dependency, never a wasm dependency.
host = { path = "../../host", optional = true }
