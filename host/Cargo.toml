[package]
name = "host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
atom_syndication = { version = "0.13.0", default-features = false }
argon2.workspace = true
base64.workspace = true
jiff.workspace = true
http.workspace = true
html5ever.workspace = true
html-escape.workspace = true
ammonia.workspace = true
opentelemetry.workspace = true
rand.workspace = true
sha2.workspace = true
unicode-casefold.workspace = true
sqlx.workspace = true
tracing.workspace = true
rss = { version = "2.1.1", default-features = false, features = ["builders", "atom"] }
orgize.workspace = true
quick-xml = "0.42.0"
strum.workspace = true
pulldown-cmark.workspace = true
tree-sitter = "=0.27.0"
tree-sitter-highlight = "=0.27.0"
tree-sitter-elisp = "=1.7.2"
tree-sitter-haskell = "=0.23.1"
# Statically linked grammar/query catalog; only tree-sitter-highlight renders code.
syntastica-queries = "=0.6.1"
tree-sitter-asm = "=0.24.0"
tree-sitter-bash = "=0.25.0"
tree-sitter-c = "=0.24.1"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-cmake = "=0.7.1"
tree-sitter-containerfile = "=0.9.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-css = "=0.23.2"
tree-sitter-dart = "=0.2.0"
tree-sitter-diff = "=0.1.0"
tree-sitter-elixir = "=0.3.4"
tree-sitter-fish = "=3.6.0"
tree-sitter-gleam = "=1.0.0"
tree-sitter-go = "=0.23.4"
tree-sitter-html = "=0.23.2"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.23.1"
tree-sitter-json = "=0.24.8"
tree-sitter-julia = "=0.23.1"
tree-sitter-kotlin-sg = "=0.4.1"
tree-sitter-lua = "=0.2.0"
tree-sitter-make = "=1.1.1"
tree-sitter-md = "=0.3.2"
tree-sitter-nix = "=0.0.2"
tree-sitter-ocaml = "=0.24.2"
tree-sitter-php = "=0.23.11"
tree-sitter-python = "=0.23.6"
tree-sitter-r = "=1.3.0"
tree-sitter-ql = "=0.23.1"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.0"
tree-sitter-scala = "=0.24.0"
tree-sitter-sequel = "=0.3.8"
tree-sitter-swift = "=0.7.0"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-xml = "=0.7.0"
tree-sitter-yaml = "=0.7.1"
tree-sitter-zig = "=1.1.2"
tracing-log.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-opentelemetry.workspace = true
tracing-error.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
thiserror.workspace = true
common = { path = "../common", features = ["sanitize"] }
macros = { path = "../macros" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
serde_jcs = { version = "0.2.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "avif-native"] }
wuff = "=0.2.9"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["serde", "visitor"] }
rustix.workspace = true
mp4parse = "=0.17.0"
webauthn-rs.workspace = true
url.workspace = true

[dev-dependencies]
common = { path = "../common", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing"] }
tracing-subscriber = { workspace = true }

[features]
# `host` is server-only (never built for wasm — ADR-0058), so the sqlx storage
# bridge on its newtypes (e.g. `InviteCode`) is on by default. The feature only
# gates the `#[cfg(feature = "sqlx")]` impls the `StrNewtype` derive emits (#438);
# `sqlx` itself is a non-optional dep above.
default = ["sqlx"]
sqlx = []
test-utils = ["cheap-kdf"]
cheap-kdf = []
test-support = ["common/test-support"]

[lints]
workspace = true
