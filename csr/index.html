<!doctype html>
<html lang="en">

<head>
 <!-- #181 pre-paint auth: byte-identical to web::app::PREPAINT_SCRIPT
         (drift-guarded). Kept formatter-stable so the two copies match. -->
 <script>
  // prettier-ignore
  (function () {try {var m = localStorage.getItem('jaunder_auth'); if (m) {var j = JSON.parse(m), u = j.username, o = j.is_operator; if (typeof u === 'string' && /^[A-Za-z0-9_-]+$/.test(u) && (typeof o === 'undefined' || typeof o === 'boolean')) {var e = document.documentElement; e.classList.add('authed'); e.setAttribute('data-user', u); if (location.pathname === '/') {var q = new URLSearchParams(location.search); location.replace(q.get('order') === 'oldest' ? '/app?order=oldest' : '/app');} } } } catch (_) { } })();
 </script>
 <script>
  const __jaunderWasmUrl = "{{WASM_URL}}";
  window.__jaunderWasmFetch = fetch(__jaunderWasmUrl);
 </script>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <!-- No wasm preload, and that is measured rather than an oversight (#866): it
         collapsed the serial pre-fetch window as intended but bought no boot time.
         The historical 125 ms increase was the superseded response-end residual,
         not wasm instantiation (#887). See docs/observability.md §"#866". -->
 <link rel="stylesheet" href="/style/jaunder.css" />
 <link rel="stylesheet" href="/style/jaunder-themes.css" />
</head>

<body>
 <script type="module">
  import {initMeasured} from "{{GLUE_URL}}";
  performance.mark("jaunder.module.before_init");
  initMeasured(window.__jaunderWasmFetch ?? __jaunderWasmUrl);
 </script>
</body>

</html>
