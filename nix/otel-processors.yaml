# Shared Collector privacy policy; statement and pipeline order are significant.
processors:
  transform/jaunder_privacy:
    error_mode: "propagate"
    log_statements:
      - context: "log"
        statements:
          - 'set(log.cache["producer"], instrumentation_scope.name)'
          - 'set(log.cache["producer"], log.attributes["log.target"]) where
            instrumentation_scope.name == "log" and
            IsString(log.attributes["log.target"])'
          - 'keep_keys(log.attributes, ["log.target", "log.file", "log.line",
            "log.module_path", "error.kind", "error.class", "error.public",
            "error.source", "error.context", "error.disposition",
            "telemetry.origin", "db.system"]) where log.cache["producer"] ==
            "host::error"'
          - 'keep_keys(log.attributes, ["log.target", "log.file", "log.line",
            "log.module_path", "user.id", "db.system"]) where
            (log.cache["producer"] == "web::registration::api" or
            log.cache["producer"] == "web::password_reset::api" or
            log.cache["producer"] == "web::email::api")'
          - 'keep_keys(log.attributes, ["log.target", "log.file", "log.line",
            "log.module_path", "status", "db.system"]) where
            log.cache["producer"] == "tower_http::trace::on_response"'
          - 'keep_keys(log.attributes, ["log.target", "log.file", "log.line",
            "log.module_path", "db.system"]) where not (log.cache["producer"] ==
            "host::error") and not (log.cache["producer"] ==
            "web::registration::api" or log.cache["producer"] ==
            "web::password_reset::api" or log.cache["producer"] ==
            "web::email::api") and not (log.cache["producer"] ==
            "tower_http::trace::on_response") and
            (IsMatch(log.cache["producer"], "^host::") or
            IsMatch(log.cache["producer"], "^storage::") or
            IsMatch(log.cache["producer"], "^web::") or
            IsMatch(log.cache["producer"], "^jaunder::") or
            IsMatch(log.cache["producer"], "^test_support::"))'
          - 'keep_keys(log.attributes, ["log.target", "log.file", "log.line",
            "log.module_path"]) where not (log.cache["producer"] ==
            "host::error") and not (log.cache["producer"] ==
            "web::registration::api" or log.cache["producer"] ==
            "web::password_reset::api" or log.cache["producer"] ==
            "web::email::api") and not (log.cache["producer"] ==
            "tower_http::trace::on_response") and not
            (IsMatch(log.cache["producer"], "^host::") or
            IsMatch(log.cache["producer"], "^storage::") or
            IsMatch(log.cache["producer"], "^web::") or
            IsMatch(log.cache["producer"], "^jaunder::") or
            IsMatch(log.cache["producer"], "^test_support::"))'
          - 'delete_key(log.attributes, "db.system") where not
            (IsMatch(log.cache["producer"], "^host::") or
            IsMatch(log.cache["producer"], "^storage::") or
            IsMatch(log.cache["producer"], "^web::") or
            IsMatch(log.cache["producer"], "^jaunder::") or
            IsMatch(log.cache["producer"], "^test_support::"))'
          - 'delete_key(log.attributes, "error.kind") where not
            (IsString(log.attributes["error.kind"]) or
            IsInt(log.attributes["error.kind"]) or
            IsDouble(log.attributes["error.kind"]) or
            IsBool(log.attributes["error.kind"]))'
          - 'delete_key(log.attributes, "error.class") where not
            (IsString(log.attributes["error.class"]) or
            IsInt(log.attributes["error.class"]) or
            IsDouble(log.attributes["error.class"]) or
            IsBool(log.attributes["error.class"]))'
          - 'delete_key(log.attributes, "error.public") where not
            (IsString(log.attributes["error.public"]) or
            IsInt(log.attributes["error.public"]) or
            IsDouble(log.attributes["error.public"]) or
            IsBool(log.attributes["error.public"]))'
          - 'delete_key(log.attributes, "error.source") where not
            (IsString(log.attributes["error.source"]) or
            IsInt(log.attributes["error.source"]) or
            IsDouble(log.attributes["error.source"]) or
            IsBool(log.attributes["error.source"]))'
          - 'delete_key(log.attributes, "error.context") where not
            (IsString(log.attributes["error.context"]) or
            IsInt(log.attributes["error.context"]) or
            IsDouble(log.attributes["error.context"]) or
            IsBool(log.attributes["error.context"]))'
          - 'delete_key(log.attributes, "error.disposition") where not
            (IsString(log.attributes["error.disposition"]) or
            IsInt(log.attributes["error.disposition"]) or
            IsDouble(log.attributes["error.disposition"]) or
            IsBool(log.attributes["error.disposition"]))'
          - 'delete_key(log.attributes, "telemetry.origin") where not
            (IsString(log.attributes["telemetry.origin"]) or
            IsInt(log.attributes["telemetry.origin"]) or
            IsDouble(log.attributes["telemetry.origin"]) or
            IsBool(log.attributes["telemetry.origin"]))'
          - 'delete_key(log.attributes, "db.system") where not
            (IsString(log.attributes["db.system"]) or
            IsInt(log.attributes["db.system"]) or
            IsDouble(log.attributes["db.system"]) or
            IsBool(log.attributes["db.system"]))'
          - 'delete_key(log.attributes, "user.id") where not
            (IsString(log.attributes["user.id"]) or
            IsInt(log.attributes["user.id"]))'
          - 'delete_key(log.attributes, "status") where not
            (IsString(log.attributes["status"]) or
            IsInt(log.attributes["status"]))'
          - 'set(log.body, "HTML parser diagnostic; text withheld") where
            (log.cache["producer"] == "html5ever::tokenizer" or
            log.cache["producer"] == "html5ever::tree_builder" or
            log.cache["producer"] == "html5ever::serialize")'
          - 'set(log.event_name, "HTML parser diagnostic; text withheld") where
            (log.cache["producer"] == "html5ever::tokenizer" or
            log.cache["producer"] == "html5ever::tree_builder" or
            log.cache["producer"] == "html5ever::serialize")'
          - 'keep_keys(log.attributes, ["log.target", "log.file", "log.line",
            "log.module_path"]) where (log.cache["producer"] ==
            "html5ever::tokenizer" or log.cache["producer"] ==
            "html5ever::tree_builder" or log.cache["producer"] ==
            "html5ever::serialize")'
          - 'delete_key(log.cache, "producer")'
      - context: "log"
        statements:
          - 'delete_key(log.attributes, "user.id") where not
            IsMatch(log.attributes["user.id"], "^-?[0-9]+$")'
        conditions:
          - 'IsString(log.attributes["user.id"])'
      - context: "log"
        statements:
          - 'delete_key(log.attributes, "status") where not
            IsMatch(log.attributes["status"], "^-?[0-9]+$")'
        conditions:
          - 'IsString(log.attributes["status"])'
    trace_statements:
      - context: "spanevent"
        statements:
          - 'set(spanevent.cache["producer"], "")'
          - 'set(spanevent.cache["producer"], spanevent.attributes["target"])
            where IsString(spanevent.attributes["target"])'
          - 'keep_keys(spanevent.attributes, ["target", "level",
            "code.file.path", "code.module.name", "code.line.number",
            "error.kind", "error.class", "error.public", "error.source",
            "error.context", "error.disposition", "telemetry.origin",
            "db.system"]) where spanevent.cache["producer"] == "host::error"'
          - 'keep_keys(spanevent.attributes, ["target", "level",
            "code.file.path", "code.module.name", "code.line.number", "user.id",
            "db.system"]) where (spanevent.cache["producer"] ==
            "web::registration::api" or spanevent.cache["producer"] ==
            "web::password_reset::api" or spanevent.cache["producer"] ==
            "web::email::api")'
          - 'keep_keys(spanevent.attributes, ["target", "level",
            "code.file.path", "code.module.name", "code.line.number", "status",
            "db.system"]) where spanevent.cache["producer"] ==
            "tower_http::trace::on_response"'
          - 'keep_keys(spanevent.attributes, ["target", "level",
            "code.file.path", "code.module.name", "code.line.number",
            "db.system"]) where not (spanevent.cache["producer"] ==
            "host::error") and not (spanevent.cache["producer"] ==
            "web::registration::api" or spanevent.cache["producer"] ==
            "web::password_reset::api" or spanevent.cache["producer"] ==
            "web::email::api") and not (spanevent.cache["producer"] ==
            "tower_http::trace::on_response") and
            (IsMatch(spanevent.cache["producer"], "^host::") or
            IsMatch(spanevent.cache["producer"], "^storage::") or
            IsMatch(spanevent.cache["producer"], "^web::") or
            IsMatch(spanevent.cache["producer"], "^jaunder::") or
            IsMatch(spanevent.cache["producer"], "^test_support::"))'
          - 'keep_keys(spanevent.attributes, ["target", "level",
            "code.file.path", "code.module.name", "code.line.number"]) where not
            (spanevent.cache["producer"] == "host::error") and not
            (spanevent.cache["producer"] == "web::registration::api" or
            spanevent.cache["producer"] == "web::password_reset::api" or
            spanevent.cache["producer"] == "web::email::api") and not
            (spanevent.cache["producer"] == "tower_http::trace::on_response")
            and not (IsMatch(spanevent.cache["producer"], "^host::") or
            IsMatch(spanevent.cache["producer"], "^storage::") or
            IsMatch(spanevent.cache["producer"], "^web::") or
            IsMatch(spanevent.cache["producer"], "^jaunder::") or
            IsMatch(spanevent.cache["producer"], "^test_support::"))'
          - 'delete_key(spanevent.attributes, "db.system") where not
            (IsMatch(spanevent.cache["producer"], "^host::") or
            IsMatch(spanevent.cache["producer"], "^storage::") or
            IsMatch(spanevent.cache["producer"], "^web::") or
            IsMatch(spanevent.cache["producer"], "^jaunder::") or
            IsMatch(spanevent.cache["producer"], "^test_support::"))'
          - 'delete_key(spanevent.attributes, "error.kind") where not
            (IsString(spanevent.attributes["error.kind"]) or
            IsInt(spanevent.attributes["error.kind"]) or
            IsDouble(spanevent.attributes["error.kind"]) or
            IsBool(spanevent.attributes["error.kind"]))'
          - 'delete_key(spanevent.attributes, "error.class") where not
            (IsString(spanevent.attributes["error.class"]) or
            IsInt(spanevent.attributes["error.class"]) or
            IsDouble(spanevent.attributes["error.class"]) or
            IsBool(spanevent.attributes["error.class"]))'
          - 'delete_key(spanevent.attributes, "error.public") where not
            (IsString(spanevent.attributes["error.public"]) or
            IsInt(spanevent.attributes["error.public"]) or
            IsDouble(spanevent.attributes["error.public"]) or
            IsBool(spanevent.attributes["error.public"]))'
          - 'delete_key(spanevent.attributes, "error.source") where not
            (IsString(spanevent.attributes["error.source"]) or
            IsInt(spanevent.attributes["error.source"]) or
            IsDouble(spanevent.attributes["error.source"]) or
            IsBool(spanevent.attributes["error.source"]))'
          - 'delete_key(spanevent.attributes, "error.context") where not
            (IsString(spanevent.attributes["error.context"]) or
            IsInt(spanevent.attributes["error.context"]) or
            IsDouble(spanevent.attributes["error.context"]) or
            IsBool(spanevent.attributes["error.context"]))'
          - 'delete_key(spanevent.attributes, "error.disposition") where not
            (IsString(spanevent.attributes["error.disposition"]) or
            IsInt(spanevent.attributes["error.disposition"]) or
            IsDouble(spanevent.attributes["error.disposition"]) or
            IsBool(spanevent.attributes["error.disposition"]))'
          - 'delete_key(spanevent.attributes, "telemetry.origin") where not
            (IsString(spanevent.attributes["telemetry.origin"]) or
            IsInt(spanevent.attributes["telemetry.origin"]) or
            IsDouble(spanevent.attributes["telemetry.origin"]) or
            IsBool(spanevent.attributes["telemetry.origin"]))'
          - 'delete_key(spanevent.attributes, "db.system") where not
            (IsString(spanevent.attributes["db.system"]) or
            IsInt(spanevent.attributes["db.system"]) or
            IsDouble(spanevent.attributes["db.system"]) or
            IsBool(spanevent.attributes["db.system"]))'
          - 'delete_key(spanevent.attributes, "user.id") where not
            (IsString(spanevent.attributes["user.id"]) or
            IsInt(spanevent.attributes["user.id"]))'
          - 'delete_key(spanevent.attributes, "status") where not
            (IsString(spanevent.attributes["status"]) or
            IsInt(spanevent.attributes["status"]))'
          - 'set(spanevent.name, "HTML parser diagnostic; text withheld") where
            (spanevent.cache["producer"] == "html5ever::tokenizer" or
            spanevent.cache["producer"] == "html5ever::tree_builder" or
            spanevent.cache["producer"] == "html5ever::serialize")'
          - 'keep_keys(spanevent.attributes, ["target", "level",
            "code.file.path", "code.module.name", "code.line.number"]) where
            (spanevent.cache["producer"] == "html5ever::tokenizer" or
            spanevent.cache["producer"] == "html5ever::tree_builder" or
            spanevent.cache["producer"] == "html5ever::serialize")'
          - 'delete_key(spanevent.cache, "producer")'
      - context: "spanevent"
        statements:
          - 'delete_key(spanevent.attributes, "user.id") where not
            IsMatch(spanevent.attributes["user.id"], "^-?[0-9]+$")'
        conditions:
          - 'IsString(spanevent.attributes["user.id"])'
      - context: "spanevent"
        statements:
          - 'delete_key(spanevent.attributes, "status") where not
            IsMatch(spanevent.attributes["status"], "^-?[0-9]+$")'
        conditions:
          - 'IsString(spanevent.attributes["status"])'
      - context: "span"
        statements:
          - 'set(span.status.message, "")'
          - 'delete_key(span.attributes, "error.span_trace")'
          - 'delete_key(span.attributes, "span")'
          - 'delete_key(span.attributes, "spans")'
          - 'delete_key(span.attributes, "request")'
          - 'delete_key(span.attributes, "request.headers")'
          - 'delete_key(span.attributes, "response.headers")'
          - 'delete_key(span.attributes, "authorization")'
          - 'delete_key(span.attributes, "cookie")'
          - 'delete_key(span.attributes, "token")'
          - 'delete_key(span.attributes, "body")'
