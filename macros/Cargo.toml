[package]
name = "macros"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
proc-macro = true

[dependencies]
# `full` is needed by the `#[macros::server]` attribute (#714): it parses an
# `ItemFn` and rewrites its `Block`, neither of which is in syn's default feature
# set (derive/parsing/printing/clone-impls/proc-macro). The derives here only ever
# parse `DeriveInput`, which is why it was not needed before.
syn = { workspace = true, features = ["full"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[features]
# The `StrNewtype` derive emits `#[cfg(feature = "sqlx")]`-gated impls that resolve
# against the *consuming* crate's `sqlx` feature (e.g. `common`'s). Declared here — with
# no deps — so that cfg is a recognized value when `macros`'s own integration tests
# expand the derive, keeping the `unexpected_cfgs` lint quiet without pulling in sqlx.
sqlx = []

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Workspace-inherited so `features = ["derive"]` comes with it: the integration test
# expands `#[text_enum]`, whose injected `::strum::…` derives resolve only if the test
# crate depends on strum under that name.
strum = { workspace = true }

[lints]
workspace = true
